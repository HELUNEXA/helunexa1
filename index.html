function allOptions(c,moduleId){if(moduleId===5)return c.cancerOptions;if(moduleId===4)return [...c.longevityOptions,...c.catalog];if(moduleId===2)return c.quickOptions[2];if([1,8].includes(moduleId))return c.catalog;return c.quickOptions[moduleId]||[]}
function draft(moduleId,audience='individual'){assert(Number.isInteger(moduleId)&&moduleId>=1&&moduleId<=8,'Hizmet seçin.');if(moduleId!==8)audience='individual';return {moduleId,audience,selected:[],area:'Merkez',mode:moduleId===6?'visit':'clinic',providerId:null,groupSize:25,contact:{name:'',phone:''}}}
function option(c,d,id){assert(allOptions(c,d.moduleId).some(x=>x.id===id),'Bu seçenek seçili hizmete ait değil.');const n=clone(d);n.selected=n.selected.includes(id)?n.selected.filter(x=>x!==id):[...n.selected,id];return n}
function filter(c,d,patch){const n={...clone(d),...patch};if(!modes(n.moduleId,n.audience).includes(n.mode))n.mode=modes(n.moduleId,n.audience)[0];if(!providers(c,n).some(p=>p.id===n.providerId))n.providerId=null;return n}
function request(c,d,records){assert(d.moduleId===8?['employee','corporate'].includes(d.audience):d.audience==='individual','Başvuru türü hizmete uygun değil.');assert(modes(d.moduleId,d.audience).includes(d.mode),'Hizmet yeri uygun değil.');assert(['Merkez','Kuzey','Güney'].includes(d.area),'Bölge seçin.');const p=providers(c,d).find(p=>p.id===d.providerId);assert(p,'Hizmeti sunan bir kurum seçin.');assert(d.selected.every(id=>allOptions(c,d.moduleId).some(x=>x.id===id)),'Seçenekler bu hizmete ait olmalı.');assert(d.audience!=='corporate'||[25,50,100].includes(d.groupSize),'Katılım aralığı seçin.');const contact=contactInfo(d.contact);return {id:'HX-'+String(records.length+1).padStart(3,'0'),moduleId:d.moduleId,audience:d.audience,selected:[...d.selected],area:d.area,mode:d.mode,providerId:p.id,providerName:p.name,...(d.audience==='corporate'?{groupSize:d.groupSize}:{}),person:{name:d.audience==='corporate'?c.company.name:contact.name,contactName:contact.name,phone:contact.phone},status:'new',createdAt:new Date().toISOString()}}
return {contactInfo,groupMinimum,labels,modeLabels,today,modes,providers,allOptions,draft,option,filter,request};
});

const C=window.HELUNEXA_CONTENT,M=window.AccessModel;
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons=['＋','↻','▤','◌','⌕','⌂','♡','▦'];
let state={view:'home',step:0,draft:M.draft(1),records:[]};
const module=id=>C.modules.find(x=>x.id===id),draft=()=>state.draft;

function button(text,action,cls='',attrs=''){return `<button class="button ${cls}" data-action="${action}" ${attrs}>${text}</button>`}
function chips(label,items,value,key){return `<div class="choice"><span class="label">${label}</span><div class="chips" role="group" aria-label="${label}">${items.map(x=>button(esc(x.name),'choice',x.id===value?'button chip selected':'button chip',`data-key="${key}" data-value="${esc(x.id)}"`)).join('')}</div></div>`}
function go(view){state.view=view;render();window.scrollTo({top:0,behavior:'instant'})}
function header(){return `<header><div class="header-inner"><a href="#" class="brand" data-action="home"><img src="logo.png" alt="HELUNEXA"></a><nav aria-label="Ana menü">${button('Hizmetler','home',state.view==='home'?'button nav active':'button nav')}${button('Hekim Girişi','institution','button nav secondary')}</nav></div></header>`}

function home(){return `<main><section class="home-intro"><img src="logo.png" alt="HELUNEXA"><h1>Hangi konuda destek arıyorsunuz?</h1><p>Hizmetinizi seçin, size uygun kurumu bulun, talebinizi iletin.</p></section><div class="service-grid">${C.modules.map(m=>`<button class="service-tile" data-action="start" data-id="${m.id}"><span class="service-icon">${icons[m.id-1]}</span><span>${esc(m.shortTitle)}</span></button>`).join('')}</div></main>`}
function info(x){return x.education?`<details style="margin-top:5px;"><summary>Neyi değerlendirir?</summary><p class="small muted" style="margin-top:5px;">${esc(x.education)}</p></details>`:''}
function options(items){return items.map(x=>`<div class="option"><label class="check"><input type="checkbox" data-option="${esc(x.id)}" ${draft().selected.includes(x.id)?'checked':''}><span>${esc(x.name)}</span></label>${info(x)}</div>`).join('')}
function laboratory(){return `<details class="catalog" style="margin-top:20px; border-top:1px solid var(--line); padding-top:15px;"><summary>Tetkik seçeneklerini inceleyin · İsteğe bağlı</summary><div style="margin-top:15px;">${C.catalogGroups.map(g=>`<details class="option-group"><summary>${esc(g)}</summary>${options(C.catalog.filter(x=>x.group===g))}</details>`).join('')}</div></details>`}

function selection(){const d=draft(),m=module(d.moduleId);return `<main><div class="page-title"><div class="eyebrow">Hizmet seçimi</div><h1>${esc(m.title)}</h1><p>${esc(m.description)}</p></div>${steps()}<section class="panel">${d.moduleId===8?`<h2>Sağlığınıza zaman ayırın.</h2>${chips('Nasıl katılmak istersiniz?',[{id:'employee',name:'Çalışanım'},{id:'corporate',name:'Kurumum için planlıyorum'}],d.audience,'audience')}`:''}${d.moduleId===4?`<h2>Hangi alanlar ilginizi çekiyor?</h2><div class="option-list">${options(C.longevityOptions)}</div>`:d.moduleId===5?`<h2>Tarama seçeneklerini keşfedin.</h2>${options(C.cancerOptions)}`:C.quickOptions[d.moduleId]?`<h2>İlgilendiğiniz hizmet</h2>${options(C.quickOptions[d.moduleId])}`:''}${[1,4,8].includes(d.moduleId)?laboratory():''}${d.moduleId===2?'<p class="small muted">Gerekli tahlilleri hekiminiz takip görüşmesinde planlar.</p>':''}<p class="small muted" style="margin-top:20px;">Tetkik seçimleri kesinleşmiş tıbbi istem değildir.</p></section>${bottom('Kurumları gör','next')}</main>`}
function steps(){return `<ol class="steps">${['Hizmet','Kurum ve yer','İletişim'].map((x,i)=>`<li class="${i<=state.step?'active':''}"><span>${i+1}</span>${x}</li>`).join('')}</ol>`}
function bottom(label,action){return `<div class="bottom-actions">${button('Geri','back','ghost')}${button(label+' →',action,'primary')}</div>`}

function locationScreen(){const d=draft(),list=M.providers(C,d);return `<main><div class="page-title"><div class="eyebrow">${esc(module(d.moduleId).shortTitle)}</div><h1>Size uygun kurum ve yer.</h1></div>${steps()}<section class="panel soft">${chips('Bulunduğunuz bölge',[{id:'Merkez',name:'Merkez'},{id:'Kuzey',name:'Kuzey'},{id:'Güney',name:'Güney'}],d.area,'area')}${chips(d.moduleId===6?'Hizmet yeri':'Hizmet tercihi',M.modes(d.moduleId,d.audience).map(id=>({id,name:M.modeLabels[id]})),d.mode,'mode')}</section><div class="provider-grid">${list.length?list.map(p=>`<article class="provider-card ${d.providerId===p.id?'chosen':''}"><h3>${esc(p.name)}</h3><p class="provider-location">${esc(p.area)} · ${p.distances[d.area]} km</p><div class="provider-facts"><div><span>Dönüş</span><strong>${esc(p.response)}</strong></div><div><span>Ücret</span><strong>${esc(p.fee)}</strong></div></div>${button(d.providerId===p.id?'Seçildi ✓':'Bu kurumu seç','provider',d.providerId===p.id?'primary full':'full',`data-id="${p.id}"`)}</article>`).join(''):`<section class="panel"><h3>Kurum bulunamadı.</h3><p>Bölgeyi değiştirebilirsiniz.</p></section>`}</div>${bottom('Devam et','next')}</main>`}
function selectionTags(record){const names=M.allOptions(C,record.moduleId);return record.selected.length?`<div style="display:flex; gap:5px; flex-wrap:wrap; margin:15px 0;">${record.selected.map(id=>`<span style="font-size:12px; padding:5px 10px; background:#ecfdf5; border:1px solid #a7f3d0; border-radius:6px; color:#065f46;">${esc(names.find(x=>x.id===id)?.name||id)}</span>`).join('')}</div>`:'<p class="small muted">Genel hizmet başvurusu · Ayrıntılar kurumla netleştirilecek.</p>'}

function requestScreen(){const d=draft(),p=C.providers.find(x=>x.id===d.providerId);return `<main><div class="page-title"><div class="eyebrow">Son adım</div><h1>Talebiniz hazır.</h1><p>Adınızı ve telefonunuzu paylaşın; seçtiğiniz hastane sizi arasın.</p></div>${steps()}<div class="two-col"><section class="panel"><div class="eyebrow">${esc(module(d.moduleId).shortTitle)}</div><h2>${esc(p.name)}</h2><p>${esc(M.modeLabels[d.mode])} · ${esc(d.area)}</p>${selectionTags(d)}</section><aside class="panel soft"><h3>Size nasıl ulaşalım?</h3><div class="contact-fields"><label for="contact-name">Ad soyad</label><input id="contact-name" data-contact="name" type="text" value="${esc(d.contact.name)}" placeholder="Örn. Deniz Örnek"><label for="contact-phone">Telefon numarası</label><input id="contact-phone" data-contact="phone" type="tel" value="${esc(d.contact.phone)}" placeholder="05xx xxx xx xx"><p id="contact-error" style="color:#ef4444; font-size:12px; margin-top:5px;"></p></div></aside></div>${bottom('Talebimi ilet','submit')}</main>`}
function booking(){return state.step===0?selection():state.step===1?locationScreen():requestScreen()}
function render(){const body=state.view==='home'?home():state.view==='booking'?booking():home();$('#app').innerHTML=header()+body+`<footer>© 2026 HELUNEXA · Tüm Hakları Saklıdır.</footer>`}

document.addEventListener('click',e=>{
    const el=e.target.closest('[data-action]'); if(!el) return; e.preventDefault(); const a=el.dataset.action;
    try{
        if(a==='home') go('home');
        else if(a==='institution') window.location.href = 'admin.html';
        else if(a==='start'){state.draft=M.draft(Number(el.dataset.id));state.step=0;go('booking');}
        else if(a==='back'){if(state.step===0)go('home');else{state.step--;go('booking')}}
        else if(a==='next'){if(state.step===1&&!M.providers(C,draft()).some(p=>p.id===draft().providerId))throw Error('Lütfen bir kurum seçin.');state.step=Math.min(2,state.step+1);go('booking')}
        else if(a==='choice'){state.draft=M.filter(C,draft(),{[el.dataset.key]:el.dataset.value});render()}
        else if(a==='provider'){state.draft={...draft(),providerId:el.dataset.id};render()}
        else if(a==='submit'){
            const error=document.getElementById('contact-error');if(error)error.textContent='';
            try { M.contactInfo(draft().contact); } catch (e) { error.textContent=e.message; return; }
            if (!draft().providerId) { alert('Lütfen bir kurum seçin.'); return; }
            el.disabled = true; el.textContent = 'Gönderiliyor...';
            
            let finalDraft = {...draft()};
            if(finalDraft.moduleId === 8) { finalDraft.audience = 'employee'; }
            const r=M.request(C,finalDraft,[]);
            
            _supabase.from('applications').insert([{
                fullname: r.person.name, phone: r.person.phone, service_type: module(draft().moduleId).title,
                test_notes: draft().selected.join(', '), status: 'pending', age: 30, email: 'anonim@helunexa.com' 
            }]).then(({error})=>{
                if(error){ alert('Veritabanı Hatası: ' + error.message); el.disabled = false; el.textContent = 'Talebimi ilet →'; return; }
                alert('✅ Talebiniz Alındı! Hastane sizinle iletişime geçecek.'); go('home');
            }).catch(err => { alert('Bağlantı hatası: ' + err.message); el.disabled = false; });
        }
    }catch(err){ alert(err.message); }
});
document.addEventListener('input',e=>{const k=e.target.dataset.contact;if(k)state.draft.contact[k]=e.target.value;});
document.addEventListener('change',e=>{if(e.target.dataset.option)state.draft=M.option(C,draft(),e.target.dataset.option);});
render();
</script>
</body>
</html>
