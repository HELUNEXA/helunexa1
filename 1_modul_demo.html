ları <small>İsteğe bağlı</small><textarea id="previous" placeholder="Sonuçlarınızı ve tarihlerini buraya not edebilirsiniz.">${esc(p.previous)}</textarea></label><label class="full">Beklentileriniz ve eklemek istedikleriniz <small>İsteğe bağlı</small><textarea id="wish">${esc(p.wish)}</textarea></label><label class="check full"><input id="measureConfirmed" type="checkbox" ${p.measureConfirmed?'checked':''}>Boy ve kilomu kontrol ettim.</label></div><div class="form-actions"><button type="button" class="btn secondary" data-route="home">Geri</button><button class="btn">Tercihlerime geç ${icon('arrow')}</button></div></form>`:UI.stage===1?`<h2>Merak ettiklerinizi paylaşın.</h2><p>Hekiminizle değerlendirmek istediğiniz tetkikleri işaretleyebilirsiniz.</p>${catalog('requested')}<div class="form-actions"><button class="btn secondary" data-stage="0">Geri</button><button class="btn" data-stage="2">Başvurumu incele ${icon('arrow')}</button></div>`:`<h2>Başvurunuzu kontrol edin.</h2><div class="review-block">${profileSummary()}</div>${historySummary()}<div class="review-block"><h3>Hekimle görüşmek istediğiniz tetkikler · ${UI.case.requested.length}</h3>${requestedList()}</div><p class="notice">Panel, başvurunuz değerlendirildikten sonra hekiminiz tarafından oluşturulur.</p><div class="form-actions"><button class="btn secondary" data-stage="1">Düzenle</button><button class="btn" data-action="submit">Başvuruyu gönder ${icon('arrow')}</button></div>`}</section>${sideSummary()}</div>`;}
function requestedList(){return UI.case.requested.length?`<ul style="font-size:12px;padding-left:18px">${UI.case.requested.map(id=>`<li>${esc(item(id).name)}</li>`).join('')}</ul>`:'<p class="empty-list">Tetkik tercihi belirtilmedi.</p>';}
function timeline(){const c=UI.case;return `<div class="timeline">${[['Başvuru','Bilgileriniz iletildi.'],['Hekim paneli',c.status==='submitted'?'Değerlendirme bekleniyor.':'Panel oluşturuldu.'],['Sonuç takibi',c.status==='closed'?'Takip tamamlandı.':'Sonuçlar ve sonraki adım.']].map(([a,b],i)=>`<div class="timeline-item ${i===0||i===1&&c.status!=='submitted'||i===2&&['approved','closed'].includes(c.status)?'current':''}"><b>0${i+1} / ${a}</b><small>${b}</small></div>`).join('')}</div>`;}
function tracking(){const c=UI.case;if(c.status==='draft')return `<div class="page-head"><div><div class="eyebrow">BAŞVURU VE TAKİP</div><h1>Her adımınız burada.</h1></div></div><section class="panel empty"><span class="square">${icon('file')}</span><h2>Henüz gönderilmiş başvurunuz yok.</h2><p>Check-up başvurunuzu tamamladıktan sonra hekim panelinizi ve takip adımlarınızı buradan görebilirsiniz.</p><button class="btn" data-action="application">${c.profile.age?'Taslağa devam et':'Başvuruya başla'} ${icon('arrow')}</button></section>`;return `<div class="page-head"><div><div class="eyebrow">CHECK-UP / ${c.id}</div><h1>Başvurunuz ve kontrol planınız.</h1><p>${esc(c.profile.name||'Örnek başvuru')} · ${statusLabel()}</p></div><button class="btn secondary small" data-action="export">Özeti indir ↗</button></div><div class="content-grid"><section class="panel">${timeline()}<div class="review-block">${profileSummary()}</div>${historySummary()}${c.status==='submitted'?`<div class="status-line"><span class="square">${icon('clock')}</span><div><h3>Hekim değerlendirmesi bekleniyor.</h3><p>Tetkik paneliniz henüz oluşturulmadı.</p></div></div><div class="review-block"><h3>Paylaştığınız tetkik tercihleri</h3>${requestedList()}</div><div class="form-actions"><button class="btn secondary" data-action="editDraft">Başvurumu düzenle</button><button class="btn secondary" data-route="modules">Modüllere dön</button></div>`:`<div class="row-heading"><h3>Hekimin belirlediği panel · ${c.clinical.length}</h3><span class="tag">Kaydedildi</span></div>${c.clinical.length?c.clinical.map(id=>`<article class="result-item"><h3 style="font-size:13px">${esc(item(id).name)}</h3><span class="module-status">${c.results[id]?.received?'✓ Sonuç ulaştı':'○ Sonuç bekleniyor'}</span>${c.results[id]?.value?`<p class="preserve" style="font-size:12px;color:var(--muted)">${esc(c.results[id].value)}</p>`:''}${education(item(id))}</article>`).join(''):'<p class="empty-list">Tetkik planlanmadı.</p>'}<div class="review-block"><h3>Hekim değerlendirmesi</h3><p><b>${esc(c.doctor)}</b></p><p class="preserve">${esc(c.note||'Değerlendirme notu eklenmedi.')}</p></div><div class="status-line"><span class="square">${icon(c.status==='closed'?'check':'clock')}</span><div><h3>${c.status==='closed'?'Takip tamamlandı':'Takibiniz sürüyor'}</h3><p>${esc(c.followup.action||'Sonraki adım hekiminiz tarafından kaydedilecek.')}</p>${c.followup.date?`<p>Kontrol / sonraki işlem: ${esc(c.followup.date)}</p>`:''}<p>Takip sorumlusu: ${esc(c.followup.owner)}</p></div></div>`}</section>${sideSummary()}</div>`;}
function doctor(){if(UI.role!=='doctor')return `<section class="panel empty"><h2>Hekim görünümüne geçin.</h2><p>Bu alan yalnızca hekim iş akışının demosudur.</p><button class="btn" data-action="logout">Giriş sayfasına dön</button></section>`;const c=UI.case;const active=c.status!=='draft';if(UI.doctorDetail&&active)return doctorDetail();return `<div class="page-head"><div><div class="eyebrow">HEKİM ÇALIŞMA ALANI / DEMO</div><h1>Başvurular ve takip.</h1><p>Başvuruyu inceleyin, paneli oluşturun ve sonraki adımı kaydedin.</p></div></div><div class="metrics"><div class="metric"><b>${active?1:0}</b><span>Toplam başvuru</span></div><div class="metric"><b>${c.status==='submitted'?1:0}</b><span>Değerlendirme bekliyor</span></div><div class="metric"><b>${c.status==='closed'?1:0}</b><span>Takip tamamlandı</span></div></div><div class="tabs" aria-label="Başvuru filtresi">${[['all','Tümü'],['submitted','Bekleyen'],['approved','Takipte'],['closed','Tamamlanan']].map(([v,l])=>`<button class="${UI.filter===v?'active':''}" data-filter="${v}">${l}</button>`).join('')}</div>${active&&(UI.filter==='all'||UI.filter===c.status)?`<article class="case-row"><div><h3>${esc(c.profile.name||'Örnek başvuru')}</h3><p>${c.id} · Rutin kontrol / Check-up · ${esc(c.profile.age)} yaş</p><span class="tag">${statusLabel()}</span></div><button class="btn secondary small" data-action="caseDetail">Başvuruyu aç ${icon('arrow')}</button></article>`:`<section class="panel empty"><span class="square">${icon('users')}</span><h2>${active?'Bu filtrede başvuru yok.':'Henüz başvuru yok.'}</h2><p>${active?'Başvurunuzu görmek için diğer filtrelere geçin.':'Henüz gönderilmiş check-up başvurusu bulunmuyor.'}</p></section>`}`;}
function clinicalList(){return UI.case.clinical.length?UI.case.clinical.map(id=>`<div class="selected-row"><span>${esc(item(id).name)}</span><button data-remove="${id}" aria-label="${esc(item(id).name)} panelden çıkar">×</button></div>`).join(''):'<p class="empty-list">Henüz tetkik seçilmedi.</p>';}
function doctorDetail(){const c=UI.case;return `<div class="page-head"><div><div class="eyebrow">HEKİM / ${c.id}</div><h1>${c.status==='submitted'?'Tetkik panelini oluşturun.':'Sonuçları ve takibi kaydedin.'}</h1><p>${esc(c.profile.name||'Örnek başvuru')} · Rutin kontrol / Check-up</p></div><button class="btn secondary small" data-action="doctorList">Başvurulara dön</button></div><section class="panel"><div class="review-block">${profileSummary()}</div>${historySummary()}${c.status==='submitted'?`${c.presentationOnly?'<div class="presentation-tool"><span>Sunum için kurgusal örnek panel</span><button class="btn secondary small" data-action="loadPresentationPanel">Örnek paneli yükle</button></div>':''}<div class="review-block"><h3>Kullanıcının tetkik tercihleri · ${c.requested.length}</h3>${requestedList()}</div><div class="form-fields"><label class="full">Değerlendiren hekim<input id="doctorName" value="${esc(c.doctor)}" placeholder="Hekim adı"></label></div><div class="row-heading"><h3>Hekimin seçtiği panel · <span id="clinicalCount">${c.clinical.length}</span></h3><span class="tag neutral">Otomatik seçim yok</span></div><div id="clinicalList">${clinicalList()}</div><details class="review-block" open><summary>Tetkik kataloğundan seç</summary>${catalog('clinical')}</details><div class="form-fields"><label class="full">Değerlendirme ve takip notu <small>İsteğe bağlı</small><textarea id="doctorNote">${esc(c.note)}</textarea></label><label class="check full"><input id="reviewed" type="checkbox" ${c.reviewed?'checked':''}>Başvuru bilgilerini ve önceki sonuçları değerlendirerek paneli belirledim.</label></div><div class="form-actions"><button class="btn secondary" data-action="doctorList">Geri</button><button class="btn" data-action="approve">Paneli onayla ${icon('check')}</button></div>`:`<div class="row-heading"><h3>Hekim paneli · ${c.clinical.length} tetkik</h3><button class="text-button" data-action="reopen">Paneli düzenle ↗</button></div>${c.presentationOnly&&c.status==='approved'?'<div class="presentation-tool"><span>Kurgusal sonuçlar ve örnek takip notu</span><button class="btn secondary small" data-action="loadPresentationResults">Örnek sonuçları yükle</button></div>':''}<div class="result-list">${c.clinical.length?c.clinical.map(id=>`<article class="result-item"><label class="check"><input type="checkbox" data-result="${id}" ${c.results[id]?.received?'checked':''}><span><b>${esc(item(id).name)}</b><small>Sonuç ulaştı ve kayda alındı.</small></span></label><label class="visually-hidden" for="result-${id}">${esc(item(id).name)} sonuç notu</label><input type="text" id="result-${id}" data-value="${id}" value="${esc(c.results[id]?.value||'')}" placeholder="Sonuç / değerlendirme notu · İsteğe bağlı"></article>`).join(''):'<p class="empty-list">Bu başvuruda tetkik planlanmadı.</p>'}</div><div class="form-fields"><label>Takip sorumlusu<input id="owner" value="${esc(c.followup.owner)}"></label><label>Kontrol / sonraki işlem tarihi<input type="date" id="followDate" value="${esc(c.followup.date)}"></label><label class="full">Sonuç değerlendirmesi ve sonraki adım<textarea id="action">${esc(c.followup.action)}</textarea></label><label class="check full"><input type="checkbox" id="followReviewed" ${c.followup.reviewed?'checked':''}>Değerlendirmeyi tamamladım ve kullanıcıyı bilgilendirdim.</label><label class="check full"><input type="checkbox" id="completed" ${c.followup.completed?'checked':''}>Gerekli sonraki işlem tamamlandı veya ek işlem gerekmediği kaydedildi.</label></div>${c.status==='closed'?'<div id="closedBanner" class="status-line"><span class="square">'+icon('check')+'</span><h3>Takip tamamlandı.</h3></div>':''}<div class="form-actions"><button class="btn secondary" data-action="saveFollow">Takibi açık tutarak kaydet</button><button class="btn" data-action="complete">Takibi tamamla ${icon('check')}</button></div>`}</section>`;}
function modal(title,body,actions=''){const d=$('dialog');d.innerHTML=`<h2>${title}</h2>${body}<div class="form-actions">${actions}<button class="btn secondary" data-action="closeDialog">Kapat</button></div>`;d.showModal();}
function about(){modal('HELUNEXA platform önizlemesi','<p>Check-up başvurusu, hekim paneli ve sonuç takibi çalışan bir demodur. Diğer modüller geliştirme aşamasındadır.</p><p>Örnek bilgilerle deneyin. Gerçek hesap, hekim hizmeti, tetkik istemi veya ödeme oluşturulmaz. “2 dakikalık sunumu başlat” hazır kurgusal bir başvuru açar; rehber sizi hasta, hekim ve sonuç adımlarında ilerletir. Veriler yalnızca bu tarayıcı oturumunun belleğinde tutulur; sayfa yenilendiğinde silinir.</p><p>Hasta ve hekim girişleri örnek oturumlardır; gerçek kimlik doğrulama değildir. Canlı kullanım için kimlik doğrulama, güvenli kayıt ve kurum entegrasyonu ayrıca geliştirilmelidir.</p><div class="link-row"><a class="text-button" href="HELUNEXA_Platform.zip" download>Kaynak ZIP’i indir ↗</a><button class="text-button" data-action="export">Başvuru özetini indir ↗</button></div>');}
function readProfile(){for(const key of ['name','age','sex','weight','height','healthHistory','supplements','pregnancyNote','familyHistory','previous','wish'])if($(key))UI.case.profile[key]=$(key).value;UI.case.profile.measureConfirmed=$('measureConfirmed')?.checked||false;}
function beginPresentation(){UI.case=Flow.presentationCase();UI.presentation=true;UI.presentationPhase=1;UI.stage=0;UI.search='';UI.doctorSearch='';UI.filter='all';UI.role='patient';UI.doctorDetail=false;$('dialog').close();goto('application',0);}
function presentationBar(){if(!UI.presentation)return '';const phase=UI.presentationPhase;const labels=['Başvuru','Hekim paneli','Hasta planı','Sonuçlar','Takip'];let title='',next='';if(phase===1){title='Hazır başvuruyu inceleyip gönderin.';}else if(phase===2){title=UI.role==='doctor'?'Örnek paneli yükleyin, inceleyip onaylayın.':'Başvuru hazır; hekim değerlendirmesine geçin.';if(UI.role!=='doctor')next='Hekim paneline geç';}else if(phase===3){title='Hekim planı kaydedildi. Hasta tarafında gösterin.';next='Hasta planını göster';}else if(phase===4){title=UI.role==='doctor'?'Örnek sonuçları yükleyin; inceleme onaylarını verip takibi tamamlayın.':'Hekimin oluşturduğu plan burada. Şimdi sonuç takibini gösterin.';if(UI.role!=='doctor')next='Sonuç takibine geç';}else{title=UI.role==='patient'?'Sunum tamamlandı. Hasta, sonuçları ve sonraki adımı görüyor.':'Takip tamamlandı. Son durumu hasta tarafında gösterin.';if(UI.role!=='patient')next='Hasta takibini göster';}return `<section class="presentation-guide" aria-label="Sunum rehberi"><div class="presentation-heading"><b>CHECK-UP SUNUMU <small>Kurgusal örnek</small></b><button class="text-button" data-action="restartPresentation">Yeniden başlat ↻</button></div><ol>${labels.map((x,i)=>`<li class="${i+1===phase?'active':i+1<phase?'done':''}" ${i+1===phase?'aria-current="step"':''}><span>${i+1}</span>${x}</li>`).join('')}</ol><div class="presentation-next"><p>${title}</p>${next?`<button class="btn small" data-action="presentationNext">${next} ${icon('arrow')}</button>`:''}</div></section>`;}
function presentationNext(){const phase=UI.presentationPhase;if(phase===2){UI.role='doctor';UI.doctorDetail=true;goto('doctor');}else if(phase===3){UI.role='patient';UI.presentationPhase=4;goto('tracking');}else if(phase===4){UI.role='doctor';UI.doctorDetail=true;goto('doctor');}else if(phase===5){UI.role='patient';goto('tracking');}}
function render(){if(!UI.role&&!['public'].includes(UI.page))UI.page='public';if(UI.role==='patient'&&UI.page==='doctor')UI.page='modules';if(UI.role==='doctor'&&['application','tracking'].includes(UI.page))UI.page='modules';sidebar();topbar();document.body.classList.toggle('public-page',!UI.role);document.body.classList.remove('menu-open');$('backdrop').hidden=true;$('main').innerHTML=presentationBar()+({public:home,home:modulesPage,modules:modulesPage,application,tracking,doctor}[UI.page]||home)();bind();}
function bind(){if($('profileForm')){$('profileForm').oninput=readProfile;$('profileForm').onsubmit=e=>{e.preventDefault();readProfile();try{const p=UI.case.profile;validateProfile({...p,route:'well',age:+p.age,weight:+p.weight,height:+p.height});goto('application',1);}catch(err){toast(err.message);}};}bindCatalog();if($('doctorName'))$('doctorName').oninput=e=>{UI.case.doctor=e.target.value;};if($('doctorNote'))$('doctorNote').oninput=e=>{UI.case.note=e.target.value;};if($('reviewed'))$('reviewed').onchange=e=>UI.case.reviewed=e.target.checked;const invalidates=()=>{Flow.editFollowup(UI.case);if(UI.presentation)UI.presentationPhase=4;$('closedBanner')?.remove();if($('followReviewed'))$('followReviewed').checked=false;if($('completed'))$('completed').checked=false;};document.querySelectorAll('[data-result]').forEach(el=>el.onchange=()=>{UI.case.results[el.dataset.result].received=el.checked;invalidates();});document.querySelectorAll('[data-value]').forEach(el=>el.oninput=()=>{UI.case.results[el.dataset.value].value=el.value;invalidates();});for(const [id,key] of [['owner','owner'],['followDate','date'],['action','action']])if($(id))$(id).oninput=e=>{UI.case.followup[key]=e.target.value;invalidates();};for(const [id,key] of [['followReviewed','reviewed'],['completed','completed']])if($(id))$(id).onchange=e=>{if(UI.case.status==='closed'){UI.case.status='approved';UI.case.closedAt=null;$('closedBanner')?.remove();}UI.case.followup[key]=e.target.checked;};}
function bindCatalog(){const clinical=UI.page==='doctor',name=clinical?'clinical':'requested';document.querySelectorAll(`input[name="${name}"]`).forEach(el=>el.onchange=()=>{const prop=clinical?'clinical':'requested';const ids=new Set(UI.case[prop]);el.checked?ids.add(el.value):ids.delete(el.value);UI.case[prop]=Flow.unique([...ids]);if(clinical){UI.case.reviewed=false;if($('reviewed'))$('reviewed').checked=false;$('clinicalCount').textContent=UI.case.clinical.length;$('clinicalList').innerHTML=clinicalList();}if($('selectionCount'))$('selectionCount').textContent=`${clinical?'Panel':'Tercih'}: ${UI.case[prop].length} / 50`;if($('asideSelection'))$('asideSelection').innerHTML=UI.case.requested.length?'<ul>'+UI.case.requested.map(id=>`<li>${esc(item(id).name)}</li>`).join('')+'</ul>':'<p>Henüz tercih belirtilmedi.</p>';});const search=$(clinical?'clinicalSearch':'catalogSearch');if(search)search.oninput=()=>{const q=search.value;clinical?UI.doctorSearch=q:UI.search=q;const list=CATALOG.filter(t=>(t.name+' '+t.group+' '+t.purpose).toLocaleLowerCase('tr-TR').includes(q.toLocaleLowerCase('tr-TR')));$('catalogList').innerHTML=catalogGroups(list,name,!!q);bindCatalog();};}
document.addEventListener('click',e=>{const el=e.target.closest('[data-route],[data-stage],[data-action],[data-module],[data-filter],[data-remove]');if(!el)return;if(el.dataset.route){e.preventDefault();goto(el.dataset.route);return;}if(el.dataset.stage!==undefined){goto('application',+el.dataset.stage);return;}if(el.dataset.module!==undefined){const i=+el.dataset.module;if(i===0){if(!UI.role){modal('Rutin kontrol / Check-up','<p>Başvurunuz için hasta girişini, başvuruları değerlendirmek için hekim girişini kullanın.</p>','<button class="btn" data-action="patientLogin">Hasta Girişi</button><button class="btn secondary" data-action="doctorLogin">Hekim Girişi</button>');}else if(UI.role==='doctor'){UI.doctorDetail=false;goto('doctor');}else navigateApp();return;}modal(modules[i][0],`<p>${modules[i][1]}</p><p>Durum: ${modules[i][3]}. Bu modül henüz kullanıma açık değil.</p>`);return;}if(el.dataset.filter){UI.filter=el.dataset.filter;render();return;}if(el.dataset.remove){UI.case.clinical=UI.case.clinical.filter(id=>id!==el.dataset.remove);UI.case.reviewed=false;render();return;}const a=el.dataset.action;try{if(a==='startPresentation'){if(UI.case.status!=='draft'||UI.case.profile.name||UI.case.profile.age){modal('Sunum senaryosunu başlat','<p>Bu oturumdaki örnek başvurunun yerine hazır sunum senaryosu yüklenecek.</p>','<button class="btn" data-action="confirmPresentation">Sunumu başlat</button>');}else beginPresentation();}else if(a==='restartPresentation'){modal('Sunumu yeniden başlat','<p>Sunum başvuru aşamasına dönecek; örnek panel ve sonuçlar sıfırlanacak.</p>','<button class="btn" data-action="confirmPresentation">Yeniden başlat</button>');}else if(a==='confirmPresentation'){beginPresentation();}else if(a==='presentationNext'){presentationNext();}else if(a==='loadPresentationPanel'){if(UI.role!=='doctor')throw Error('Hekim girişi gerekli.');Flow.presentationPanel(UI.case);render();toast('Örnek panel eklendi. İnceleyip değerlendirme onayını verin.');}else if(a==='loadPresentationResults'){if(UI.role!=='doctor')throw Error('Hekim girişi gerekli.');Flow.presentationResults(UI.case);render();toast('Kurgusal sonuçlar eklendi. Takip onayları henüz verilmedi.');}else if(a==='patientLogin'||a==='doctorLogin'){$('dialog').close();UI.role=a==='patientLogin'?'patient':'doctor';UI.doctorDetail=false;UI.filter='all';goto('modules');}else if(a==='logout'){UI.role=null;UI.doctorDetail=false;goto('public');}else if(a==='application')navigateApp();else if(a==='about')about();else if(a==='closeDialog')$('dialog').close();else if(a==='menu'){UI.menu=!UI.menu;document.body.classList.toggle('menu-open',UI.menu);$('backdrop').hidden=!UI.menu;document.querySelector('.mobile-menu')?.setAttribute('aria-expanded',String(UI.menu));}else if(a==='example'){UI.case.profile={...UI.case.profile,name:'Örnek Kullanıcı',age:40,sex:'Kadın',weight:60,height:160,measureConfirmed:true};render();toast('Örnek bilgiler eklendi.');}else if(a==='submit'){Flow.submit(UI.case);if(UI.presentation)UI.presentationPhase=2;goto('tracking');}else if(a==='editDraft'){UI.case.status='draft';UI.case.submittedAt=null;if(UI.presentation)UI.presentationPhase=1;goto('application',0);}else if(a==='caseDetail'){UI.doctorDetail=true;render();}else if(a==='doctorList'){UI.doctorDetail=false;goto('doctor');}else if(a==='approve'){Flow.approve(UI.case);if(UI.presentation)UI.presentationPhase=3;render();window.scrollTo({top:0,behavior:'instant'});toast('Hekim paneli kaydedildi.');}else if(a==='reopen'){modal('Paneli yeniden düzenle','<p>Panel onayı kaldırılacak ve mevcut sonuç / takip kayıtları bu demoda sıfırlanacak.</p>','<button class="btn" data-action="confirmReopen">Düzenlemeye geç</button>');}else if(a==='confirmReopen'){Flow.reopen(UI.case);if(UI.presentation)UI.presentationPhase=2;$('dialog').close();render();}else if(a==='saveFollow'){if(UI.presentation)UI.presentationPhase=4;if(UI.case.status==='closed'){UI.case.status='approved';UI.case.closedAt=null;}toast('Takip açık olarak bu oturumda kaydedildi.');render();}else if(a==='complete'){Flow.close(UI.case);if(UI.presentation)UI.presentationPhase=5;render();toast('Takip tamamlandı.');}else if(a==='export'){const data={schemaVersion:'platform-1.2.0',prototypeOnly:true,case:UI.case};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='HELUNEXA_ornek_basvuru.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}}catch(err){toast(err.message);}});
$('backdrop').onclick=()=>{UI.menu=false;document.body.classList.remove('menu-open');$('backdrop').hidden=true;};$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))$('dialog').close();});render();

</script></body></html>
