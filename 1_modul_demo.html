<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HELUNEXA · Rutin Kontrol / Check-up</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --bg: #f8fafc; --teal: #10b981; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); margin: 0; }
.header { background: white; padding: 15px 30px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
.header img { height: 50px; }
.container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
.card { background: white; padding: 30px; border-radius: 12px; border: 1px solid var(--line); }
h1 { font-size: 28px; margin-bottom: 10px; }
p { color: var(--muted); font-size: 15px; margin-bottom: 20px; }
.form-group { margin-bottom: 15px; }
label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; font-family: inherit; }
.btn { background: var(--teal); color: white; padding: 14px; width: 100%; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
.btn:hover { background: #059669; }
/* Modal */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; padding: 20px; z-index: 100; }
.modal.active { display: flex; }
.modal-box { background: white; padding: 30px; border-radius: 12px; max-width: 450px; width: 100%; }
.modal-box h3 { margin-bottom: 10px; }
</style>
</head>
<body>
    <div class="header">
        <img src="logo.png" alt="HELUNEXA">
    </div>

    <div class="container">
        <div class="card">
            <h1>Check-up Ön Kaydı</h1>
            <p>Lütfen bilgilerinizi girin. Sistemi test etmek için "Örnek Doldur"a basabilirsiniz.</p>
            
            <div class="form-group"><label>Ad Soyad</label><input type="text" id="name" value="Deniz Örnek"></div>
            <div class="form-group"><label>Yaş</label><input type="number" id="age" value="35"></div>
            <div class="form-group"><label>Talepleriniz</label><textarea id="notes">Genel kontrol, kan tahlilleri ve demir değerlerime baktırmak istiyorum.</textarea></div>
            
            <button class="btn" onclick="openModal()">Ön Kaydı Tamamla →</button>
        </div>
    </div>

    <!-- B2B HASTANE YÖNLENDİRME MODALI -->
    <div class="modal" id="hospitalModal">
        <div class="modal-box">
            <h3>🏥 Hastane Yönlendirmesi</h3>
            <p style="font-size:13px;">HELUNEXA bir aracı platformdur. Ön kaydınız oluşturulduktan sonra, anlaşmalı hastanemiz randevu ve **ödeme** süreci için sizinle iletişime geçecektir.</p>
            
            <div class="form-group">
                <label>Anlaşmalı Hastane Seçin</label>
                <select>
                    <option>Acıbadem Hastanesi</option>
                    <option>Memorial Hastanesi</option>
                    <option>Medical Park</option>
                </select>
            </div>
            <button class="btn" onclick="complete()">Yönlendirmeyi Onayla ve Bitir</button>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('hospitalModal').classList.add('active');
        }
        function complete() {
            alert('✅ Başvurunuz alındı! Hastane randevu ve ödeme detayları için sizinle iletişime geçecektir.');
            document.getElementById('hospitalModal').classList.remove('active');
        }
    </script>
</body>
</html>
