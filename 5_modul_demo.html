);margin-bottom:16px}.hero{max-width:850px;padding:26px 0}.hero p{font-size:20px;max-width:650px}.entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.entry{border:1px solid var(--line);background:white;border-radius:20px;padding:28px;text-align:left;color:var(--ink);transition:0.2s}.entry strong{display:block;font-size:23px;margin:14px 0 7px}.entry span{display:block;color:var(--muted)}.entry:hover{border-color:var(--green);box-shadow:0 10px 25px rgba(16,185,129,0.1);transform:translateY(-2px)}.entry .icon{font-size:28px;color:var(--green)}.actions{justify-content:space-between;margin:26px 0 0}.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:35px}.area{border:1px solid var(--line);border-radius:18px;padding:24px;background:white}.area .eyebrow{margin-bottom:12px}.area h3{font-size:19px}.area p{font-size:14px;color:var(--muted)}details{border-top:1px solid var(--line);padding:18px 0;margin-top:16px}summary{cursor:pointer;color:var(--green);font-weight:600}details p{margin:16px 0 0}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px}.page-head h1{font-size:36px}.page-head p{color:var(--muted)}.card{border:1px solid var(--line);border-radius:22px;background:white;padding:30px;margin-bottom:22px;box-shadow:0 4px 6px rgba(0,0,0,0.02);}.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:25px;align-items:start}.side{background:var(--pale);border-color:#d1fae5;}.side p,.side li{font-size:14px;color:var(--muted)}.side li{margin:14px 0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{margin-bottom:22px}.form-grid .field{margin:0}label{display:block;font-weight:600;margin-bottom:8px}input:not([type=checkbox]),select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:13px;min-height:48px;background:white;color:var(--ink);font-size:16px;outline:none;transition:0.2s}input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--pale);}textarea{min-height:95px;resize:vertical}.check{display:flex;gap:12px;font-weight:500;margin:20px 0;align-items:flex-start;font-size:14px;cursor:pointer;}.check input{width:22px;height:22px;flex:0 0 22px;margin-top:2px;accent-color:var(--green);cursor:pointer;}.choice{display:flex;gap:12px;padding:15px;border:1px solid var(--line);border-radius:12px;font-weight:500}.choice:has(input:checked){background:var(--pale);border-color:var(--green)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.choice input{width:20px;height:20px;accent-color:var(--green)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:22px 0 30px}.step{border-top:3px solid var(--line);padding-top:10px;color:var(--muted);font-size:13px}.step.active{border-color:var(--green);color:var(--ink);font-weight:bold;}.guide{background:var(--pale);border:1px solid #a7f3d0;padding:18px 24px;border-radius:16px;margin-bottom:28px}.guide p{font-size:14px;margin:8px 0 0;color:var(--green-dark);font-weight:500;}.guide .row{justify-content:space-between}.summary{display:grid;grid-template-columns:1fr 1fr;gap:20px}.summary dt{font-size:13px;color:var(--muted);margin-bottom:6px}.summary dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:500;}.summary .wide{grid-column:1/-1}.notice{padding:18px 20px;border-radius:14px;background:var(--pale);font-size:14px;margin:20px 0;border:1px solid #d1fae5;}.warn{background:#fffbeb;color:var(--warn);border-color:#fde68a;}.outcome{background:var(--pale);border-left:4px solid var(--green);border-radius:14px;padding:24px;margin:24px 0}.outcome p,.pre{white-space:pre-wrap;overflow-wrap:anywhere}.badge{display:inline-block;background:var(--pale);color:var(--green-dark);padding:6px 12px;border-radius:24px;font-size:12px;font-weight:bold;border:1px solid #a7f3d0;}.result{border-top:1px solid var(--line);padding:24px 0}.timeline p{border-left:2px solid var(--line);padding-left:18px;font-size:14px;margin:20px 0}.timeline b{display:block}.empty{text-align:center;padding:45px 20px}footer{max-width:1180px;margin:auto;border-top:1px solid var(--line);display:flex;gap:20px;justify-content:space-between;align-items:center;padding:25px 24px 40px;color:var(--muted);font-size:12px}dialog{border:1px solid var(--line);border-radius:20px;max-width:620px;width:calc(100% - 32px);padding:28px;color:var(--ink);box-shadow:0 20px 40px rgba(0,0,0,0.2);}dialog::backdrop{background:rgba(15,23,42,0.5);backdrop-filter:blur(4px);}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 30px);padding:16px 24px;border-radius:13px;background:var(--ink);color:white;z-index:100;box-shadow:0 6px 30px rgba(0,0,0,0.2);font-weight:bold;}section[hidden]{display:none}.reference-list li{margin:14px 0}.spacer{height:22px}@media(max-width:820px){.grid{grid-template-columns:1fr}.side{display:none}.catalog{grid-template-columns:1fr 1fr}.page-head h1{font-size:31px}}@media(max-width:560px){header{padding:16px 18px;flex-wrap:wrap;gap:12px}.brand{font-size:21px}.nav{gap:8px}.nav .btn{font-size:13px;padding:10px 12px;min-height:42px}main{padding:28px 18px 40px}.hero{padding:12px 0}.hero h1{font-size:36px}.hero p{font-size:17px}.entry-grid,.form-grid,.choices,.grid2,.catalog,.summary{grid-template-columns:1fr}.summary .wide{grid-column:auto}.entry,.area,.card{padding:21px}.card{border-radius:18px}.page-head{flex-direction:column;gap:6px}.steps{gap:9px}.step{font-size:11px}.actions{align-items:stretch}.actions .btn{flex:1}.guide{padding:17px}footer{align-items:flex-start;flex-direction:column;padding:22px 18px}.hero .mini{font-size:12px}}
</style></head><body><noscript><p>Bu modül JavaScript etkin bir tarayıcıda çalışır.</p></noscript><a href="#main" class="skip">İçeriğe geç</a><header id="header"></header><main id="main" tabindex="-1"></main><footer><span>HELUNEXA · Modül 05 · Kanser Taraması</span><span>Bilgiler bu sekmede tutulur</span><button class="text" data-action="about">Modül hakkında ↗</button></footer><dialog id="dialog"></dialog><div id="toast" role="status" hidden></div><script>(function(root){'use strict';
const CATALOG=[
 {id:'mammo',name:'Mamografi',area:'Meme',description:'Meme dokusundaki şüpheli değişikliklerin erken saptanmasına yardımcı olur.'},
 {id:'hpv',name:'HPV-DNA',area:'Rahim ağzı',description:'Rahim ağzı kanseriyle ilişkili yüksek riskli HPV tiplerinin varlığını araştırır.'},
 {id:'fit',name:'Gaitada gizli kan / FIT',area:'Kalın bağırsak',description:'Dışkıda gözle görülmeyen kanı araştırır. Pozitif sonuç ileri değerlendirme gerektirir.'},
 {id:'colonoscopy',name:'Kolonoskopi',area:'Kalın bağırsak',description:'Kalın bağırsağın iç yüzeyini, polipleri ve şüpheli değişiklikleri doğrudan değerlendirmeye yardımcı olur.'},
 {id:'ldct',name:'Düşük doz akciğer BT',area:'Akciğer',description:'Uygun risk grubunda akciğerdeki nodül ve şüpheli değişiklikleri araştırır.'},
 {id:'psa',name:'PSA değerlendirmesi',area:'Prostat',description:'Prostat kaynaklı PSA düzeyini ölçer. Tek başına kanser tanısı koymaz.'}
];
const trim=v=>String(v??'').trim();
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function validDate(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v||''))return false;const d=new Date(v+'T12:00:00Z');return Number.isFinite(+d)&&d.toISOString().slice(0,10)===v;}
function future(days){const d=new Date(today()+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10);}
function fresh(){return {profile:null,submitted:false,plan:null,ack:false,results:{},evaluation:null,history:[]};}
function log(s,text){s.history.push({at:new Date().toISOString(),text});}
function profileError(p){if(!Number.isInteger(Number(p.age))||Number(p.age)<18||Number(p.age)>120)return 'Yaşınızı 18–120 arasında girin.';for(const key of ['symptoms','cancer','abnormal'])if(!['no','yes','unknown'].includes(p[key]))return 'Şikâyet, kişisel kanser öyküsü ve önceki anormal sonuç durumunu tamamlayın.';if(p.symptoms==='yes'&&!trim(p.symptomNote))return 'Şikâyetinizi kısaca yazın.';if(p.cancer==='yes'&&!trim(p.cancerNote))return 'Kanser öykünüzü kısaca belirtin.';if(p.abnormal==='yes'&&!trim(p.previous))return 'Önceki anormal sonuca ilişkin bildiklerinizi yazın.';if(!['never','current','former','unknown'].includes(p.smoking))return 'Sigara kullanım durumunu seçin.';return '';}
function submit(s,p){const e=profileError(p);if(e)throw Error(e);s.profile=JSON.parse(JSON.stringify(p));s.submitted=true;s.plan=null;s.results={};s.ack=false;s.evaluation=null;log(s,'Başvuru hekim değerlendirmesine iletildi.');}
function needsAssessment(p){return ['symptoms','cancer','abnormal'].some(k=>p[k]!=='no');}
function planError(s,p){if(!s.submitted)return 'Önce başvuru iletilmeli.';if(!trim(p.doctor))return 'Hekim adını girin.';if(!p.reviewed)return 'Paylaşılan bilgileri değerlendirdiğinizi onaylayın.';if(!['screen','info','exam'].includes(p.decision))return 'Sonraki adımı seçin.';if(!trim(p.note))return 'Kullanıcıya iletilecek planı yazın.';if(!validDate(p.date)||p.date<today())return 'Bugün veya sonrasında geçerli bir tarih seçin.';if(p.decision==='screen'){
 if(needsAssessment(s.profile))return 'Şikâyet, kanser öyküsü veya önceki anormal / belirsiz sonuç için ek bilgi ya da değerlendirme adımını seçin.';
 if(!p.tests||!p.tests.length)return 'Tarama planına en az bir inceleme ekleyin.';
 if(p.tests.some(id=>!CATALOG.some(t=>t.id===id))||new Set(p.tests).size!==p.tests.length)return 'Tetkik listesini kontrol edin.';
 }return '';}
function savePlan(s,p){const e=planError(s,p);if(e)throw Error(e);s.plan=JSON.parse(JSON.stringify(p));if(p.decision!=='screen')s.plan.tests=[];s.results={};s.ack=false;s.evaluation=null;log(s,'Hekim planı kullanıcıya iletildi.');}
function acknowledge(s){if(!s.plan||s.plan.decision!=='screen')throw Error('Önce tarama planı oluşturulmalı.');s.ack=true;log(s,'Kullanıcı tarama planını gördüğünü belirtti.');}
function saveResults(s,results){if(!s.ack||s.plan?.decision!=='screen')throw Error('Önce hekim planını inceleyin.');const next={...s.results};let count=0;for(const id of s.plan.tests){const r=results[id];if(!r||(!trim(r.text)&&!r.date))continue;if(!trim(r.text)||!validDate(r.date)||r.date>today())throw Error('Her paylaşılan sonuç için açıklama ve geçerli sonuç tarihini tamamlayın.');next[id]={text:trim(r.text),date:r.date};count++;}if(!count)throw Error('En az bir sonuç paylaşın.');s.results=next;s.evaluation=null;log(s,'Sonuç bilgileri hekim değerlendirmesine iletildi.');}
function evaluationError(s,e){if(!s.plan||s.plan.decision!=='screen'||!s.ack)return 'Onaylanmış tarama planı gerekli.';if(s.plan.tests.some(id=>!s.results[id]))return 'Planlanan tüm sonuçlar paylaşılmadan değerlendirme tamamlanamaz.';if(!trim(e.doctor)||!e.reviewed)return 'Değerlendiren hekimi ve sonuç inceleme onayını tamamlayın.';if(s.plan.tests.some(id=>!['normal','abnormal','insufficient'].includes(e.statuses?.[id])))return 'Her sonuç için değerlendirme durumunu seçin.';const further=s.plan.tests.some(id=>e.statuses[id]!=='normal');if(!['routine','referral','repeat'].includes(e.action))return 'Sonraki adımı seçin.';if(further&&e.action==='routine')return 'Anormal veya yetersiz sonuç için ileri değerlendirme / tekrar adımını seçin.';if(!trim(e.note)||!trim(e.responsible))return 'Takip planını ve sorumlu hekim / birimi belirtin.';if(!validDate(e.date)||e.date<today())return 'Geçerli bir takip tarihi seçin.';return '';}
function evaluate(s,e){const err=evaluationError(s,e);if(err)throw Error(err);s.evaluation=JSON.parse(JSON.stringify(e));log(s,e.action==='routine'?'Sonuç değerlendirmesi ve kontrol planı iletildi.':'İleri değerlendirme / tekrar planı iletildi; takip açık.');}
function reopen(s){s.submitted=false;s.plan=null;s.results={};s.ack=false;s.evaluation=null;log(s,'Başvuru düzenlemeye açıldı; önceki plan ve sonuçlar temizlendi.');}
function example(){return {name:'Deniz Örnek',age:'55',sex:'Kadın',symptoms:'no',symptomNote:'',cancer:'no',cancerNote:'',abnormal:'no',smoking:'never',smokingNote:'',family:'Bilinen ailede kanser öyküsü yok.',previous:'Mamografi, HPV-DNA ve bağırsak taraması raporlarım şu an yanımda değil.',health:'Bilinen operasyon yok.',wish:'Önceki taramalarımı gözden geçirip uygun kontrol planını belirlemek istiyorum.'};}
function examplePlan(){return {doctor:'Dr. Örnek Hekim',decision:'screen',reviewed:false,date:future(14),tests:['mammo','hpv','fit'],note:'Önceki tarama bilgileri ve uygunluk görüşüldükten sonra mamografi, HPV-DNA ve gaitada gizli kan incelemesi planlandı.'};}
const api={CATALOG,today,validDate,future,fresh,profileError,submit,needsAssessment,planError,savePlan,acknowledge,saveResults,evaluationError,evaluate,reopen,example,examplePlan};if(typeof module!=='undefined')module.exports=api;else root.Screening=api;
})(typeof window!=='undefined'?window:globalThis);
</script><script>(()=>{'use strict';const M=Screening,$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state=M.fresh(),view='home',step=1,draft={},planDraft=null,guide=false,documents={};
const name=id=>M.CATALOG.find(t=>t.id===id)?.name||id;
const date=d=>M.validDate(d)?d.split('-').reverse().join('.'):'';
const button=(action,text,cls='')=>`<button type="button" class="btn ${cls}" data-action="${action}">${text}</button>`;
function field(id,label,type='text',v='',attrs=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" value="${esc(v)}" ${attrs}></div>`;}
function textarea(id,label,v='',attrs=''){return `<div class="field"><label for="${id}">${label}</label><textarea id="${id}" name="${id}" ${attrs}>${esc(v)}</textarea></div>`;}
function select(id,label,opts,v='',attrs=''){return `<div class="field"><label for="${id}">${label}</label><select id="${id}" name="${id}" ${attrs}><option value="">Seçiniz</option>${opts.map(([val,text])=>`<option value="${val}" ${val===v?'selected':''}>${text}</option>`).join('')}</select></div>`;}
const yn=[['no','Hayır'],['yes','Evet'],['unknown','Bilmiyorum / emin değilim']];
function heading(eyebrow,title,sub='',action=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`;}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,6000);}
function cleanDocuments(){Object.values(documents).forEach(d=>URL.revokeObjectURL(d.url));documents={};}
function render(){
 $('#header').innerHTML=`<a href="#" class="brand" data-action="home"><img src="logo.png" alt="HELUNEXA"></a><nav class="nav" aria-label="Ana menü">${button('patient','Hasta Girişi','secondary')}${button('doctor','Hekim Girişi','secondary')}</nav>`;
 $('#main').innerHTML=(guide?`<aside class="guide"><div class="row"><b>KANSER TARAMASI · SÜREÇ</b><button class="text" data-action="start">Yeniden başlat ↻</button></div><p>${!state.submitted?'Hazır başvuruyu inceleyip gönderin.':!state.plan?'Hekim ekranında tarama planını oluşturun.':!state.ack?'Hasta ekranında planı inceleyin.':!state.evaluation?'Sonuçları paylaşın; hekim ekranında değerlendirin.':'Takip planı hasta ekranına iletildi.'}</p></aside>`:'')+(view==='home'?home():view==='patient'?patient():view==='review'?review():view==='doctor'?doctor():tracking());$('#main').focus({preventScroll:true});window.scrollTo(0,0);
}
function home(){return `<section class="hero"><div class="eyebrow">MODÜL 05 · KİŞİSELLEŞTİRİLMİŞ KANSER TARAMASI</div><h1>Doğru tarama,<br>zamanında takip.</h1><p class="muted">Geçmiş taramalarınızı ve sağlık bilgilerinizi paylaşın. Hekiminizin belirlediği planı ve sonuç sonrası adımları birlikte takip edin.</p><div class="entry-grid"><button class="entry" data-action="patient"><span class="icon">↗</span><strong>Hasta Girişi</strong><span>Başvuru, tarama planı ve sonuçlar</span></button><button class="entry" data-action="doctor"><span class="icon">✳</span><strong>Hekim Girişi</strong><span>Değerlendirme ve takip planı</span></button></div><div class="actions">${button('start','Süreci başlat →','soft')}</div></section><section class="catalog" aria-label="Tarama hakkında bilgi">${M.CATALOG.map(t=>`<article class="area"><div class="eyebrow">${t.area}</div><h3>${t.name}</h3><details><summary>Neyi değerlendirir?</summary><p>${t.description}</p></details></article>`).join('')}</section>`;}
function side(){return `<aside class="card side"><div class="eyebrow">BİRLİKTE PLANLAYALIM</div><h3>Geçmişten sonraki adıma.</h3><ol><li>Tarama geçmişinizi paylaşın.</li><li>Hekiminiz planı oluştursun.</li><li>Sonuçlar ve takip planı aynı yerde olsun.</li></ol><p>18 yaş ve üzeri bireyler için başvuru modülü.</p></aside>`;}
function patient(){if(state.submitted)return tracking();let body='';if(step===1){body=`<h2>Kısaca sizi tanıyalım.</h2><div class="form-grid">${field('name','Başvuru adı','text',draft.name)}${field('age','Yaş','number',draft.age,'required min="18" max="120" step="1"')}${select('sex','Cinsiyet',[['Kadın','Kadın'],['Erkek','Erkek'],['Belirtmek istemiyorum','Belirtmek istemiyorum']],draft.sex)}${select('symptoms','Yeni bir şikâyetiniz var mı?',yn,draft.symptoms,'required')}</div>${textarea('symptomNote','Varsa şikâyetinizi kısaca belirtin',draft.symptomNote)}${select('cancer','Daha önce kanser tanısı aldınız mı?',yn,draft.cancer,'required')}${textarea('cancerNote','Varsa tanı ve takip bilgileri',draft.cancerNote)}${textarea('health','Operasyon, önemli hastalık, kullanılan ilaçlar',draft.health)}<div class="actions">${button('home','Geri','secondary')}<button class="btn" type="submit">Öyküme geç →</button></div>`;
 }else if(step===2){body=`<h2>Risk ve tarama geçmişiniz.</h2>${select('smoking','Sigara kullanımınız',[['never','Hiç kullanmadım'],['current','Kullanıyorum'],['former','Bıraktım'],['unknown','Belirtmek istemiyorum']],draft.smoking,'required')}${textarea('smokingNote','Kullanıyorsanız günlük miktar, kullanım süresi',draft.smokingNote)}${textarea('family','Ailede kanser öyküsü',draft.family)}${select('abnormal','Önceki taramalarda anormal sonuç bildirildi mi?',yn,draft.abnormal,'required')}${textarea('previous','Önceki mamografi, HPV / smear, bağırsak incelemeleri',draft.previous)}${textarea('wish','Beklentiniz ve eklemek istedikleriniz',draft.wish)}<div class="actions">${button('back','Geri','secondary')}<button class="btn" type="submit">Başvurumu incele →</button></div>`;}
 return heading('HASTA BAŞVURUSU','Size uygun taramayı planlayalım.','Kısa öykü, önceki taramalar ve beklentileriniz.',button('example','Örnek doldur','secondary'))+`<div class="grid"><form class="card" id="patientForm">${body}</form>${side()}</div>`;
}
function summary(p){return `<dl class="summary"><div><dt>Başvuru</dt><dd>${esc(p.name||'İsimsiz')} · ${esc(p.age)} yaş</dd></div><div><dt>Cinsiyet</dt><dd>${esc(p.sex||'Belirtilmedi')}</dd></div><div class="wide"><dt>Önceki taramalar</dt><dd>${esc(p.previous||'Belirtilmedi')}</dd></div></dl><details><summary>Paylaşılan sağlık ve risk bilgileri</summary><dl class="summary">${[['Yeni şikâyet',p.symptoms==='yes'?p.symptomNote:p.symptoms==='no'?'Yok':'Belirsiz'],['Kişisel kanser öyküsü',p.cancer==='yes'?p.cancerNote:p.cancer==='no'?'Yok':'Belirsiz'],['Önceki anormal sonuç',p.abnormal==='yes'?'Bildirildi':p.abnormal==='no'?'Bildirilmedi':'Belirsiz'],['Sigara durumu',({never:'Hiç kullanmadım',current:'Kullanıyorum',former:'Bıraktım',unknown:'Belirtilmedi'})[p.smoking]],['Sigara ayrıntısı',p.smokingNote],['Aile öyküsü',p.family],['Hastalık ve diğer bilgiler',p.health],['Beklenti',p.wish]].map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v||'Belirtilmedi')}</dd></div>`).join('')}</dl></details>`;}
function review(){return heading('KONTROL VE GÖNDERİM','Başvurunuzu kontrol edin.','Bilgileriniz hekim değerlendirmesine iletilecek.')+`<div class="card">${summary(draft)}${M.needsAssessment(draft)?'<p class="notice">Paylaştığınız şikâyet veya önceki bilgiler için hekim uygun değerlendirme adımını belirleyecek.</p>':''}<div class="actions">${button('edit','Düzenle','secondary')}${button('send','Başvuruyu gönder →')}</div></div>`;}
function references(){return `<details><summary>Tarama çerçevesi ve kaynaklar</summary><ul class="reference-list mini"><li>Türkiye ulusal programı: 40–69 yaş kadınlarda iki yılda bir mamografi; 30–65 yaş kadınlarda beş yılda bir HPV-DNA; 50–70 yaş kadın ve erkeklerde iki yılda bir gaitada gizli kan. <a href="https://ankaragolbasism.saglik.gov.tr/TR-391495/kanser-taramalari-danismanligi.html" target="_blank" rel="noopener">Sağlık Bakanlığı ↗</a></li></ul></details>`;}
function doctor(){if(!state.submitted)return heading('HEKİM PANELİ','Başvurularınız.','Henüz gönderilmiş başvuru yok.')+`<div class="card empty"><h2>İlk başvuruyu bekliyoruz.</h2>${button('exampleSubmit','Örnek başvuru yükle','soft')}</div>`;const p=planDraft||state.plan||{};return heading('HEKİM PANELİ','Geçmişi inceleyin, sonraki adımı belirleyin.','Tarama planı ve sonuç değerlendirmesi tek dosyada.',button('tracking','Hasta ekranını gör','secondary'))+`<div class="card">${summary(state.profile)}</div>${M.needsAssessment(state.profile)?'<p class="notice">Şikâyet veya önceki anormal sonuç bildirildi. Ek bilgi veya ilgili değerlendirme adımını seçin.</p>':''}<form id="planForm" class="card"><h2>Tarama / değerlendirme planı</h2>${field('doctor','Değerlendiren hekim','text',p.doctor,'required')}${select('decision','Sonraki adım',[['screen','Tarama planı oluştur'],['info','Ek bilgi / önceki rapor iste'],['exam','Muayene / ilgili uzmanlık değerlendirmesi']],p.decision,'required')}<section id="testsSection" ${p.decision!=='screen'?'hidden':''}><div class="row" style="justify-content:space-between"><h3>Planlanan incelemeler</h3>${button('examplePlan','Örnek planı doldur','secondary')}</div><div class="choices">${M.CATALOG.map(t=>`<label class="choice"><input type="checkbox" name="tests" value="${t.id}" ${(p.tests||[]).includes(t.id)?'checked':''}><span>${t.name}</span></label>`).join('')}</div></section>${textarea('note','Kullanıcıya iletilecek plan',p.note,'required')}${field('planDate','Planlanan tarih','date',p.date,'required min="'+M.today()+'"')}<label class="check"><input name="reviewed" type="checkbox" ${p.reviewed?'checked':''} required><span>Öyküyü ve kişisel uygunluğu değerlendirdim; planı oluşturdum.</span></label><button class="btn" type="submit">Planı kaydet ve kullanıcıya ilet →</button></form>${state.plan?.decision==='screen'?resultReview():''}<details><summary>İşlem geçmişi</summary>${history()}</details>`;}
function history(){return `<div class="timeline">${state.history.map(h=>`<p><b>${esc(h.text)}</b>${new Date(h.at).toLocaleString('tr-TR',{timeZone:'Europe/Istanbul'})}</p>`).join('')}</div>`;}
function docLink(id){const d=documents[id];return d?`<p><a target="_blank" rel="noopener" href="${esc(d.url)}">${esc(d.name)} ↗</a></p>`:'';}
function resultReview(){const e=state.evaluation||{},all=state.plan.tests.every(id=>state.results[id]);return `<section class="card"><h2>Sonuçları değerlendirin.</h2><p class="mini">${Object.keys(state.results).length} / ${state.plan.tests.length} sonuç paylaşıldı.</p>${!all?'<p class="notice">Eksik sonuçlar bekleniyor.</p>':''}<form id="evaluationForm">${state.plan.tests.map(id=>`<article class="result"><h3>${name(id)}</h3>${state.results[id]?`<p class="mini">Sonuç tarihi: ${date(state.results[id].date)}</p><p class="pre">${esc(state.results[id].text)}</p>${docLink(id)}${select('status_'+id,'Değerlendirme · '+name(id),[['normal','Rutin kontrol planlanabilir'],['abnormal','Anormal / şüpheli — ileri değerlendirme'],['insufficient','Yetersiz / ek inceleme gerekli']],e.statuses?.[id],'required')}`:'<span class="badge">Sonuç bekleniyor</span>'}</article>`).join('')}${field('evaluationDoctor','Sonuçları değerlendiren hekim','text',e.doctor||state.plan.doctor,'required')}${select('followAction','Sonraki adım',[['routine','Sonraki rutin kontrol'],['referral','İlgili birime / ileri değerlendirmeye yönlendirme'],['repeat','Tekrar / ek inceleme']],e.action,'required')}${textarea('followNote','Sonuç açıklaması ve takip planı',e.note,'required')}${field('responsible','Takipten sorumlu hekim / birim','text',e.responsible,'required')}${field('followDate','Sonraki kontrol tarihi','date',e.date,'required min="'+M.today()+'"')}<label class="check"><input type="checkbox" name="resultsReviewed" required><span>Sonuçları inceledim ve takip planını belirledim.</span></label><button type="submit" class="btn">Değerlendirme ve takip planını ilet →</button></form></section>`;}
function tracking(){if(!state.submitted)return patient();const p=state.plan,e=state.evaluation;return heading('HASTA PANELİ','Tarama ve takip planınız.','Hekiminizin planı, sonuçlarınız ve sonraki adımınız.',button('doctor','Hekim ekranına geç','secondary'))+`<div class="steps"><div class="step active">1 · Başvuru</div><div class="step ${p?'active':''}">2 · Hekim planı</div><div class="step ${state.ack?'active':''}">3 · Sonuçlar</div><div class="step ${e?'active':''}">4 · Takip</div></div><article class="card">${summary(state.profile)}${!p?'<div class="outcome"><h3>Hekim değerlendirmesinde.</h3><p>Planınız burada görünecek.</p></div>':`<div class="outcome"><div class="eyebrow">${p.decision==='screen'?'HEKİMİNİZİN TARAMA PLANI':p.decision==='info'?'EK BİLGİ / RAPOR BEKLENİYOR':'MUAYENE / DEĞERLENDİRME'}</div><h3>${esc(p.doctor)}</h3><p>${esc(p.note)}</p><strong>Planlanan tarih: ${date(p.date)}</strong>${p.tests.length?`<ul>${p.tests.map(id=>`<li>${name(id)}</li>`).join('')}</ul>`:''}</div>${p.decision==='screen'&&!state.ack?`<form id="ackForm"><label class="check"><input type="checkbox" required><span>Hekimimin oluşturduğu tarama planını gördüm.</span></label><button class="btn" type="submit">Planı gördüm, sonuç takibine geç →</button></form>`:''}`}</article>${p?.decision==='screen'&&state.ack?resultForm():''}${e?`<section class="card"><div class="eyebrow">${e.action==='routine'?'SONRAKİ KONTROLÜNÜZ':'TAKİP AÇIK'}</div><h2>${e.action==='routine'?'Kontrol planınız hazır.':e.action==='referral'?'İlgili değerlendirme planlandı.':'Tekrar / ek inceleme planlandı.'}</h2><p class="pre">${esc(e.note)}</p><dl class="summary"><div><dt>Takip tarihi</dt><dd>${date(e.date)}</dd></div><div><dt>Sorumlu birim</dt><dd>${esc(e.responsible)}</dd></div><div><dt>Değerlendiren</dt><dd>${esc(e.doctor)}</dd></div></dl></section>`:''}<div class="actions">${button('reopen',p?.decision==='info'?'Bilgilerimi tamamla':'Başvurumu düzenle','secondary')}${button('home','Ana sayfa','secondary')}</div><details><summary>İşlem geçmişi</summary>${history()}</details>`;}
function resultForm(){return `<section class="card"><div class="row" style="justify-content:space-between"><h2>Sonuçlarınızı paylaşın.</h2>${guide?button('exampleResults','Örnek sonuçları doldur','secondary'):''}</div><form id="resultsForm">${state.plan.tests.map(id=>`<article class="result"><h3>${name(id)}</h3><span class="badge">${state.results[id]?'Paylaşıldı':'Sonuç bekleniyor'}</span>${field('date_'+id,'Sonuç tarihi · '+name(id),'date',state.results[id]?.date,'max="'+M.today()+'"')}${textarea('result_'+id,'Rapor / sonuç bilgisi · '+name(id),state.results[id]?.text)}<div class="field"><label for="file_${id}">Belge ekle · ${name(id)}</label><input type="file" id="file_${id}" name="file_${id}" accept=".pdf,.jpg,.jpeg,.png"></div>${docLink(id)}</article>`).join('')}<button class="btn" type="submit">Sonuçları hekime ilet →</button></form></section>`;}
function capturePatient(){const f=$('#patientForm');if(f)for(const[k,v]of new FormData(f))draft[k]=v;}
function capturePlan(){const f=$('#planForm');if(!f)return planDraft;const d=new FormData(f);return planDraft={doctor:d.get('doctor'),decision:d.get('decision'),note:d.get('note'),date:d.get('planDate'),tests:d.getAll('tests'),reviewed:d.has('reviewed')};}
function about(){const d=$('#dialog');d.innerHTML=`<h2>Kişisel plan, görünür takip.</h2><p>Tarama geçmişi ve başvuru bilgilerini hekime ileten; hekim planını, sonuçları ve sonraki adımı birlikte gösteren modül.</p>${references()}${button('close','Kapat')}`;d.showModal();}
document.addEventListener('change',e=>{if(e.target.id==='decision')$('#testsSection').hidden=e.target.value!=='screen';});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();const a=el.dataset.action;try{if(view==='patient')capturePatient();if(view==='doctor')capturePlan();
 if(a==='home')view='home';else if(a==='patient')view=state.submitted?'track':'patient';else if(a==='doctor')view='doctor';else if(a==='tracking')view=state.submitted?'track':'patient';
 else if(a==='start'){cleanDocuments();state=M.fresh();draft=M.example();planDraft=null;guide=true;step=1;view='patient';}
 else if(a==='example'){draft=M.example();step=1;view='patient';}
 else if(a==='back'){step=1;}else if(a==='edit'){view='patient';step=1;}
 else if(a==='send'){M.submit(state,draft);planDraft=null;view='track';toast('Başvurunuz iletildi.');}
 else if(a==='exampleSubmit'){cleanDocuments();state=M.fresh();draft=M.example();M.submit(state,draft);planDraft=null;view='doctor';}
 else if(a==='examplePlan'){if(M.needsAssessment(state.profile))throw Error('Bu başvuru için ek bilgi veya ilgili değerlendirme adımını seçin.');planDraft=M.examplePlan();}
 else if(a==='exampleResults'){if(!guide||!state.ack)throw Error('Plan incelendikten sonra doldurulur.');for(const id of state.plan.tests){$('#date_'+id).value=M.today();$('#result_'+id).value=name(id)+' raporu. Sonuç hekim tarafından değerlendirilecek.';}toast('Sonuçlar dolduruldu.');return;}
 else if(a==='reopen'){if(state.plan&&!confirm('Başvuruyu düzenlemek mevcut planı ve sonuçları sıfırlar. Devam edilsin mi?'))return;draft=JSON.parse(JSON.stringify(state.profile));M.reopen(state);cleanDocuments();planDraft=null;step=1;view='patient';}
 else if(a==='about'){about();return;}else if(a==='close'){$('#dialog').close();return;}render();}catch(err){toast(err.message);}});
document.addEventListener('submit',e=>{e.preventDefault();try{if(e.target.id==='patientForm'){capturePatient();if(step===1){if(!draft.age||!draft.symptoms||!draft.cancer)throw Error('Yaş, şikâyet ve kanser öyküsünü tamamlayın.');if(draft.symptoms==='yes'&&!draft.symptomNote?.trim())throw Error('Şikâyetinizi belirtin.');if(draft.cancer==='yes'&&!draft.cancerNote?.trim())throw Error('Kanser öykünüzü belirtin.');step=2;}else{const err=M.profileError(draft);if(err)throw Error(err);view='review';}}
 else if(e.target.id==='planForm'){const p=capturePlan();const err=M.planError(state,p);if(err)throw Error(err);if(state.plan&&!confirm('Planı güncellemek sonuçları sıfırlar. Devam edilsin mi?'))return;M.savePlan(state,p);cleanDocuments();planDraft=null;view='track';toast('Hekim planı iletildi.');}
 else if(e.target.id==='ackForm'){M.acknowledge(state);toast('Planı gördüğünüz kaydedildi.');}
 else if(e.target.id==='resultsForm'){const d=new FormData(e.target),r={},pending=[];for(const id of state.plan.tests){const f=d.get('file_'+id);if(f?.size){pending.push([id,f]);}r[id]={date:d.get('date_'+id),text:d.get('result_'+id)||(f?.size?'Ekli rapor: '+f.name:'')};}M.saveResults(state,r);for(const[id,f]of pending){if(documents[id])URL.revokeObjectURL(documents[id].url);documents[id]={name:f.name,url:URL.createObjectURL(f)};}view='track';toast('Sonuç bilgileri iletildi.');}
 else if(e.target.id==='evaluationForm'){const d=new FormData(e.target),statuses={};for(const id of state.plan.tests)statuses[id]=d.get('status_'+id);M.evaluate(state,{doctor:d.get('evaluationDoctor'),statuses,action:d.get('followAction'),note:d.get('followNote'),date:d.get('followDate'),responsible:d.get('responsible'),reviewed:d.has('resultsReviewed')});view='track';toast('Değerlendirme ve takip planı iletildi.');}render();}catch(err){toast(err.message);}});
render();})();
</script></body></html>
