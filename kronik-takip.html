<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>HELUNEXA · Kronik Hastalık Takibi</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{--ink:#0f172a;--muted:#64748b;--teal:#10b981;--soft:#ecfdf5;--line:#e2e8f0;--bg:#f8fafc}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,sans-serif}
        header{height:80px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5vw}
        .brand-container { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .brand-container img { height: 50px; width: auto; }
        .brand{color:var(--teal);font-size:22px;font-weight:750;letter-spacing:2px;}
        .shell{max-width:1280px;margin:auto;display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 80px)}
        aside{padding:42px 26px;border-right:1px solid var(--line)}
        .side-title,.eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--teal);font-weight:700}
        nav{margin-top:24px;display:grid;gap:8px}
        nav button{background:none;border:0;text-align:left;padding:13px;border-radius:9px;color:var(--muted);font-weight: 500; font-size:14px;}
        nav button.active{background:var(--soft);color:var(--teal); font-weight: 700;}
        main{padding:40px 46px;max-width:960px;width:100%}
        h1{font-size:34px;font-weight:550;margin:13px 0}
        h2{font-size:20px;font-weight:600;margin:0 0 6px}
        .lead{color:var(--muted);max-width:580px}
        .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:25px;margin:20px 0;}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
        .disease{border:1px solid var(--line);border-radius:11px;padding:17px;cursor:pointer;display:flex;align-items:center;gap:13px;margin:0}
        .disease:has(input:checked){border-color:var(--teal);background:var(--soft)}
        label{display:block;font-size:12px;font-weight:600;margin:12px 0}
        input,select,textarea{font:inherit;display:block;width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;margin-top:6px}
        .primary,.secondary{border-radius:8px;padding:11px 18px;border:1px solid var(--teal);background:var(--teal);color:white;font-size:13px; font-weight: 600;}
        .secondary{background:white;color:var(--teal);border-color:var(--line)}
        .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
        
        .payment-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .payment-overlay.active { display: flex; }
        .payment-modal { background: white; border-radius: 16px; max-width: 450px; width: 100%; padding: 30px; }
        .payment-modal h3 { margin-bottom: 20px; }
        .payment-summary { background: #f8fafc; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid var(--teal); }
        .payment-total { display: flex; justify-content: space-between; background: var(--soft); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .payment-total strong { font-size: 22px; color: #059669; }
        .payment-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .payment-buttons button { flex: 1; padding: 12px; border-radius: 6px; font-weight: bold; border: none; cursor:pointer;}
        .btn-pay { background: #3b82f6; color: white; }
        .btn-cancel { background: #e2e8f0; color: #475569; }
        @media(max-width:760px){.shell{display:block} aside{border-right:0; border-bottom:1px solid var(--line); padding:15px 20px} main{padding:26px 20px} .grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <header>
        <a class="brand-container" href="hasta-panel.html">
            <img src="logo.png" alt="HELUNEXA">
            <div class="brand">HELUNEXA</div>
        </a>
    </header>
    
    <div class="shell">
        <aside>
            <div class="side-title">KRONİK HASTALIK TAKİBİ</div>
            <nav><button class="active">01 Başvuru</button></nav>
            <div style="border-top:1px solid var(--line);padding-top:24px;margin-top:50px;font-size:12px;color:var(--muted);">
                <b>Birlikte, düzenli takip.</b>
                <p>Dört hastalık, tek başvuru.<br>Her hastalık için ayrı takip planı.</p>
            </div>
        </aside>
        <main id="main"></main>
    </div>

    <!-- ÖDEME MODALI -->
    <div class="payment-overlay" id="paymentGatewayModal">
        <div class="payment-modal">
            <h3>💳 Güvenli Ödeme</h3>
            <div class="payment-summary">
                <div style="display:flex; justify-content:space-between;"><span>Hasta:</span><strong id="payPatient">-</strong></div>
                <div style="display:flex; justify-content:space-between;"><span>Hizmet:</span><strong>Kronik Hastalık Takibi</strong></div>
            </div>
            <div class="payment-total"><span>Ödenecek Tutar</span><strong>₺1.500</strong></div>
            <!-- ID'ler EKLENDİ -->
            <div style="margin-bottom:15px;"><label>Kart Numarası</label><input type="text" id="card_number" placeholder="0000 0000 0000 0000" maxlength="19"></div>
            <div style="display:flex; gap:10px;">
                <div style="flex:1;"><label>SKT</label><input type="text" id="card_expiry" placeholder="AA/YY" maxlength="5"></div>
                <div style="flex:1;"><label>CVV</label><input type="text" id="card_cvv" placeholder="123" maxlength="4"></div>
            </div>
            <div class="payment-buttons">
                <button type="button" class="btn-cancel" id="cancelPaymentBtn">İptal</button>
                <button type="button" class="btn-pay" id="payBtn">Ödemeyi Tamamla</button>
            </div>
        </div>
    </div>

    <script>
    const SUPABASE_URL = 'https://grbjmhknmlheoyknmyhd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lA5YB8KySIyhrLseQV56Kw_cWLCWq7p';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, storageKey: 'helunexa-hasta-auth' } });

    const diseases={ht:{name:'Hipertansiyon',sub:'Ev tansiyon ölçümleri'},dm:{name:'Tip 2 diyabet',sub:'HbA1c ve tedavi takibi'},lip:{name:'Dislipidemi',sub:'Kolesterol takibi'},thy:{name:'Hipotiroidi',sub:'Tiroid tedavisi takibi'}};
    let state = {step:1, selected:[], symptom:'', common:{}}, currentUser=null, pendingFormData=null;

    async function checkSession() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session) { 
            currentUser = session.user; 
            const kisi = JSON.parse(sessionStorage.getItem('kronik_hasta_bilgi'));
            if(kisi) state.common = { ...state.common, fullname: kisi.fullname, age: kisi.age, phone: kisi.phone };
            render(); 
        } else { window.location.href = 'giris.html'; }
    }

    function render(){
        let html = `<div class="eyebrow">BAŞVURU</div><h1>Kronik Hastalık Takibi</h1><p class="lead">Hekiminizle birlikte kişisel takip planınızı oluşturun.</p>`;
        
        if (state.step === 1) {
            html += `<form id="appForm"><section class="card"><h2>Hangi hastalıklar için takip istiyorsunuz?</h2><div class="grid">${Object.entries(diseases).map(([k,d])=>`<label class="disease"><input type="checkbox" value="${k}" ${state.selected.includes(k)?'checked':''} onchange="toggleDisease(this)"><span>${d.name}<br><small style="color:#64748b">${d.sub}</small></span></label>`).join('')}</div></section>
            <div class="actions"><button type="button" class="primary" onclick="nextStep()">Devam et →</button></div></form>`;
        } else {
            html += `<form id="appForm"><section class="card"><h2>İlaç ve Sağlık Bilgileriniz</h2>
            <label>Ad Soyad<input type="text" id="k_fullname" value="${state.common.fullname||''}"></label>
            <label>Yaş<input type="number" id="k_age" value="${state.common.age||''}"></label>
            <label>Telefon<input type="tel" id="k_phone" value="${state.common.phone||''}"></label>
            <label>Kullandığınız ilaçlar<textarea id="k_meds">${state.common.meds||''}</textarea></label>
            </section>
            <div class="actions"><button type="button" class="secondary" onclick="prevStep()">← Geri</button><button type="button" class="primary" onclick="preparePayment()">Ödemeye Geç →</button></div></form>`;
        }
        document.getElementById('main').innerHTML = html;
    }

    window.toggleDisease = function(el){ if(el.checked) state.selected.push(el.value); else state.selected = state.selected.filter(x=>x!==el.value); };
    window.nextStep = function(){ if(!state.selected.length) return alert('Hastalık seçin.'); state.step = 2; render(); };
    window.prevStep = function(){ state.step = 1; render(); };

    window.preparePayment = function(){
        state.common.fullname = document.getElementById('k_fullname').value;
        state.common.age = document.getElementById('k_age').value;
        state.common.phone = document.getElementById('k_phone').value;
        state.common.meds = document.getElementById('k_meds').value;

        if(!state.common.fullname || !state.common.age || !state.common.phone) return alert('Lütfen ad, yaş ve telefon girin.');

        pendingFormData = {
            user_id: currentUser.id, email: currentUser.email,
            fullname: state.common.fullname, age: parseInt(state.common.age), phone: state.common.phone,
            service_type: 'Kronik Hastalık Takibi',
            test_notes: `Hastalıklar: ${state.selected.map(k=>diseases[k].name).join(', ')} | İlaçlar: ${state.common.meds}`,
            status: 'pending', payment_amount: 1500
        };
        
        document.getElementById('payPatient').textContent = pendingFormData.fullname;
        document.getElementById('paymentGatewayModal').classList.add('active');
    }

    document.getElementById('cancelPaymentBtn').onclick = () => document.getElementById('paymentGatewayModal').classList.remove('active');

    document.getElementById('payBtn').onclick = async function(){
        this.disabled = true; this.textContent = 'İşleniyor...';
        await new Promise(r => setTimeout(r, 1000));
        const { error } = await _supabase.from('applications').insert([pendingFormData]);
        if (error) { alert('Hata: ' + error.message); this.disabled = false; this.textContent = 'Ödemeyi Tamamla'; }
        else { alert('✅ Ödeme Başarılı!'); window.location.href = 'hasta-panel.html'; }
    }

    // ✅ KART FORMATLAMA KODU BURAYA EKLENDİ
    document.getElementById('card_number').addEventListener('input', function (e) {
        let value = e.target.value.replace(/\D/g, '').substring(0, 16);
        e.target.value = value.replace(/(\d{4})(?=\d)/g, '$1 ');
    });
    
    document.getElementById('card_expiry').addEventListener('input', function (e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length >= 2) value = value.substring(0, 2) + '/' + value.substring(2, 4);
        e.target.value = value;
    });

    document.getElementById('card_cvv').addEventListener('input', function (e) {
        e.target.value = e.target.value.replace(/\D/g, '').substring(0, 4);
    });

    checkSession();
    </script>
</body>
</html>
