);margin-bottom:16px}.hero{max-width:850px;padding:26px 0}.hero p{font-size:20px;max-width:650px}.entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.entry{border:1px solid var(--line);background:white;border-radius:20px;padding:28px;text-align:left;color:var(--ink);transition:0.2s}.entry strong{display:block;font-size:23px;margin:14px 0 7px}.entry span{display:block;color:var(--muted)}.entry:hover{border-color:var(--green);box-shadow:0 10px 25px rgba(16,185,129,0.1);transform:translateY(-2px)}.entry .icon{font-size:28px;color:var(--green)}.actions{justify-content:space-between;margin:26px 0 0}.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:35px}.area{border:1px solid var(--line);border-radius:18px;padding:24px;background:white}.area .eyebrow{margin-bottom:12px}.area h3{font-size:19px}.area p{font-size:14px;color:var(--muted)}details{border-top:1px solid var(--line);padding:18px 0;margin-top:16px}summary{cursor:pointer;color:var(--green);font-weight:600}details p{margin:16px 0 0}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px}.page-head h1{font-size:36px}.page-head p{color:var(--muted)}.card{border:1px solid var(--line);border-radius:22px;background:white;padding:30px;margin-bottom:22px;box-shadow:0 4px 6px rgba(0,0,0,0.02);}.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:25px;align-items:start}.side{background:var(--pale);border-color:#d1fae5;}.side p,.side li{font-size:14px;color:var(--muted)}.side li{margin:14px 0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{margin-bottom:22px}.form-grid .field{margin:0}label{display:block;font-weight:600;margin-bottom:8px}input:not([type=checkbox]),select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:13px;min-height:48px;background:white;color:var(--ink);font-size:16px;outline:none;transition:0.2s}input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--pale);}textarea{min-height:95px;resize:vertical}.check{display:flex;gap:12px;font-weight:500;margin:20px 0;align-items:flex-start;font-size:14px;cursor:pointer;}.check input{width:22px;height:22px;flex:0 0 22px;margin-top:2px;accent-color:var(--green);cursor:pointer;}.choice{display:flex;gap:12px;padding:15px;border:1px solid var(--line);border-radius:12px;font-weight:500}.choice:has(input:checked){background:var(--pale);border-color:var(--green)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.choice input{width:20px;height:20px;accent-color:var(--green)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:22px 0 30px}.step{border-top:3px solid var(--line);padding-top:10px;color:var(--muted);font-size:13px}.step.active{border-color:var(--green);color:var(--ink);font-weight:bold;}.guide{background:var(--pale);border:1px solid #a7f3d0;padding:18px 24px;border-radius:16px;margin-bottom:28px}.guide p{font-size:14px;margin:8px 0 0;color:var(--green-dark);font-weight:500;}.guide .row{justify-content:space-between}.summary{display:grid;grid-template-columns:1fr 1fr;gap:20px}.summary dt{font-size:13px;color:var(--muted);margin-bottom:6px}.summary dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:500;}.summary .wide{grid-column:1/-1}.notice{padding:18px 20px;border-radius:14px;background:var(--pale);font-size:14px;margin:20px 0;border:1px solid #d1fae5;}.warn{background:#fffbeb;color:var(--warn);border-color:#fde68a;}.urgent{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;}.outcome{background:var(--pale);border-left:4px solid var(--green);border-radius:14px;padding:24px;margin:24px 0}.outcome p,.pre{white-space:pre-wrap;overflow-wrap:anywhere}.badge{display:inline-block;background:var(--pale);color:var(--green-dark);padding:6px 12px;border-radius:24px;font-size:12px;font-weight:bold;border:1px solid #a7f3d0;}.visit{border-top:1px solid var(--line);padding:24px 0}.timeline p{border-left:2px solid var(--line);padding-left:18px;font-size:14px;margin:20px 0}.timeline b{display:block}.empty{text-align:center;padding:45px 20px}footer{max-width:1180px;margin:auto;border-top:1px solid var(--line);display:flex;gap:20px;justify-content:space-between;align-items:center;padding:25px 24px 40px;color:var(--muted);font-size:12px}dialog{border:1px solid var(--line);border-radius:20px;max-width:620px;width:calc(100% - 32px);padding:28px;color:var(--ink);box-shadow:0 20px 40px rgba(0,0,0,0.2);}dialog::backdrop{background:rgba(15,23,42,0.5);backdrop-filter:blur(4px);}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 30px);padding:16px 24px;border-radius:13px;background:var(--ink);color:white;z-index:100;box-shadow:0 6px 30px rgba(0,0,0,0.2);font-weight:bold;}[hidden]{display:none!important}@media(max-width:820px){.grid{grid-template-columns:1fr}.side{display:none}.catalog{grid-template-columns:1fr 1fr}.page-head h1{font-size:31px}}@media(max-width:560px){header{padding:16px 18px;flex-wrap:wrap;gap:12px}.brand{font-size:21px}.nav{gap:8px}.nav .btn{font-size:13px;padding:10px 12px;min-height:42px}main{padding:28px 18px 40px}.hero{padding:12px 0}.hero h1{font-size:36px}.hero p{font-size:17px}.entry-grid,.form-grid,.choices,.catalog,.summary{grid-template-columns:1fr}.summary .wide{grid-column:auto}.entry,.area,.card{padding:21px}.card{border-radius:18px}.page-head{flex-direction:column;gap:6px}.steps{gap:9px}.step{font-size:11px}.actions{align-items:stretch}.actions .btn{flex:1}.guide{padding:17px}footer{align-items:flex-start;flex-direction:column;padding:22px 18px}}
</style></head><body><noscript><p>Demoyu JavaScript etkin Safari veya Chrome’da, web bağlantısını kullanarak açın.</p></noscript><a class="skip" href="#main">İçeriğe geç</a><header id="header"></header><main id="main" tabindex="-1"></main><footer><span>HELUNEXA · Modül 06 · Evde Bakım</span><span>Demo · Kurgusal bilgiler · Yenileyince silinir</span><button class="text" data-action="about">Modül hakkında ↗</button></footer><dialog id="dialog"></dialog><div id="toast" role="status" hidden></div><script>(function(root){'use strict';
const SERVICES=[['assessment','Evde ilk değerlendirme','Bakım gereksinimlerinin ve uygun hizmet kapsamının ekip tarafından değerlendirilmesi.'],['nursing','Hemşirelik bakımı','Hekimin planladığı bakımın yetkili sağlık ekibi tarafından yürütülmesi.'],['wound','Yara ve pansuman takibi','Mevcut yara bakım planının, ekip gözlemlerinin ve kontrol adımlarının izlenmesi.'],['discharge','Taburculuk sonrası takip','Taburculuk önerileri ve evdeki bakım gereksinimlerinin birlikte gözden geçirilmesi.'],['rehab','Hareket ve rehabilitasyon desteği','Uygun uzman değerlendirmesiyle günlük hareket ve rehabilitasyon ihtiyacının planlanması.'],['caregiver','Hasta yakını ve bakım desteği','Günlük bakım gereksinimlerinin, bakım verenin sorularının ve eğitim ihtiyacının paylaşılması.']];
const trim=v=>String(v??'').trim();
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function validDate(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v||''))return false;const d=new Date(v+'T12:00:00Z');return Number.isFinite(+d)&&d.toISOString().slice(0,10)===v;}
function future(n){const d=new Date(today()+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function fresh(){return {profile:null,submitted:false,version:0,plan:null,ack:false,visits:[],updates:[],followup:null,history:[]};}
function log(s,text){s.history.push({at:new Date().toISOString(),text});}
function profileError(p){if(!Number.isInteger(Number(p.age))||Number(p.age)<18||Number(p.age)>120)return 'Hasta yaşını 18–120 arasında girin.';if(!['self','relative'].includes(p.applicant))return 'Başvuruyu kimin yaptığını seçin.';if(p.applicant==='relative'&&(!trim(p.carer)||!trim(p.relationship)||!p.authorized))return 'Hasta yakınının adı, yakınlığı ve paylaşım yetkisi beyanını tamamlayın.';if(p.urgent==='yes')return 'Acil durumlarda evde bakım başvurusunu beklemeyin; 112’yi arayın.';if(!['no','unknown'].includes(p.urgent))return 'Acil yardım gereksinimi durumunu belirtin.';if(!Array.isArray(p.needs)||!p.needs.length||p.needs.some(id=>!SERVICES.some(x=>x[0]===id))||new Set(p.needs).size!==p.needs.length)return 'En az bir bakım ihtiyacı seçin.';if(!trim(p.request))return 'Bakım ihtiyacınızı kısaca yazın.';return '';}
function submit(s,p){const err=profileError(p);if(err)throw Error(err);s.profile=JSON.parse(JSON.stringify(p));s.submitted=true;s.plan=null;s.ack=false;s.followup=null;log(s,'Bakım başvurusu hekim değerlendirmesine iletildi.');}
function planError(s,p){if(!s.submitted)return 'Önce başvuru gönderilmeli.';if(!trim(p.doctor)||!p.reviewed)return 'Değerlendiren hekimi ve inceleme onayını tamamlayın.';if(!['visit','info','refer'].includes(p.decision))return 'Sonraki adımı seçin.';if(!trim(p.note)||!trim(p.team))return 'Planı ve sorumlu ekip / birimi belirtin.';if(!validDate(p.date)||p.date<today())return 'Bugün veya sonrası için geçerli bir tarih seçin.';if(p.decision==='visit'&&s.profile.urgent!=='no')return 'Acil durum gereksinimi belirsizken önce ek bilgi veya kuruma değerlendirme adımını seçin.';return '';}
function savePlan(s,p){const err=planError(s,p);if(err)throw Error(err);s.version++;s.plan={...JSON.parse(JSON.stringify(p)),version:s.version,created:today()};s.ack=false;s.followup=null;log(s,'Hekim planı iletildi · Plan '+s.version);}
function acknowledge(s){if(s.plan?.decision!=='visit')throw Error('Önce ziyaret planı oluşturulmalı.');s.ack=true;log(s,'Kullanıcı ziyaret planını gördüğünü belirtti.');}
function visitError(s,v){if(s.plan?.decision!=='visit'||!s.ack)return 'Ziyaret planı ve kullanıcının planı gördüğü kaydı gerekli.';if(!trim(v.staff)||!['Hekim','Hemşire','Fizyoterapist','Diğer sağlık çalışanı'].includes(v.role))return 'Ziyareti kaydeden sağlık çalışanını ve görevini belirtin.';if(!validDate(v.date)||v.date>today()||v.date<s.plan.created)return 'Ziyaret tarihi plan oluşturma tarihi ile bugün arasında olmalı.';if(!['done','notdone'].includes(v.outcome)||!trim(v.note)||!v.confirmed)return 'Ziyaret durumunu, notunu ve kayıt doğrulamasını tamamlayın.';if(!['no','yes','unknown'].includes(v.change))return 'Yeni sorun / değişiklik durumunu belirtin.';return '';}
function addVisit(s,v){const err=visitError(s,v);if(err)throw Error(err);s.visits.push({...JSON.parse(JSON.stringify(v)),version:s.version});s.followup=null;log(s,v.outcome==='done'?'Ekip ziyaret kaydını ekledi.':'Ziyaret gerçekleşmedi kaydı eklendi.');}
function currentVisits(s){return s.plan?s.visits.filter(v=>v.version===s.plan.version):[];}
function addUpdate(s,u){if(!s.submitted||!trim(u.note))throw Error('İletilecek bakım notunu yazın.');s.updates.push({note:trim(u.note),at:new Date().toISOString(),version:s.version});s.followup=null;log(s,'Hasta / yakını bakım notu iletti; hekim değerlendirmesi bekleniyor.');}
function followupError(s,f){const vs=currentVisits(s);if(s.plan?.decision!=='visit'||!vs.length)return 'Güncel plan için ekip ziyaret kaydı gerekli.';if(!trim(f.doctor)||!f.reviewed)return 'Hekim adı ve kayıt inceleme onayı gerekli.';if(!['continue','clarify','refer'].includes(f.action))return 'Sonraki bakım adımını seçin.';const last=vs.at(-1);if((last.outcome==='notdone'||last.change!=='no')&&f.action==='continue')return 'Gerçekleşmeyen ziyaret veya yeni / belirsiz sorun için yeniden değerlendirme ya da kuruma yönlendirme seçin.';if(!trim(f.note)||!trim(f.responsible))return 'Takip planını ve sorumlu hekim / birimi belirtin.';if(!validDate(f.date)||f.date<today())return 'Geçerli bir sonraki kontrol tarihi seçin.';return '';}
function saveFollowup(s,f){const err=followupError(s,f);if(err)throw Error(err);s.followup={...JSON.parse(JSON.stringify(f)),version:s.version};log(s,'Ziyaret sonrası takip planı kullanıcıya iletildi.');}
function reopen(s){s.submitted=false;s.plan=null;s.ack=false;s.followup=null;log(s,'Başvuru yeniden düzenlemeye açıldı; önceki ziyaret kayıtları geçmişte korundu.');}
function example(){return {name:'Deniz Örnek · Demo',age:'74',applicant:'relative',carer:'Ekin Örnek · Demo',relationship:'Çocuğu',authorized:true,urgent:'no',needs:['assessment','discharge','caregiver'],request:'Taburculuk sonrasında evde bakım ihtiyaçlarımızın değerlendirilmesini ve bakım planının netleşmesini istiyoruz.',history:'Yakın zamanda hastaneden taburcu oldu. Taburculuk bilgileri değerlendirmede paylaşılacak. Kurgusal örnek.',medicines:'Kurgusal ilaç listesi ve kullanım bilgileri görüşmede paylaşılacak.',allergy:'Bilinen alerji bildirilmedi. Kurgusal örnek.',mobility:'Destekle hareket ediyor',support:'Yakını evde destek oluyor.',location:'Örnek il / ilçe',access:'Asansör mevcut. Gün içinde bir yakını evde.',preference:'Hafta içi gündüz. Kurgusal tercih.'};}
function examplePlan(){return {doctor:'Dr. Örnek Hekim · Demo',reviewed:false,decision:'visit',date:today(),team:'Örnek Evde Bakım Ekibi · Demo',note:'Kurgusal ziyaret planı: taburculuk bilgileri, ilaç listesi, günlük bakım ihtiyacı ve bakım verenin soruları ekip tarafından gözden geçirilecek. Uygulama gereksinimi yerinde değerlendirme sonrası belirlenecek.'};}
function exampleVisit(){return {staff:'Örnek Sağlık Çalışanı · Demo',role:'Hekim',date:today(),outcome:'done',change:'no',confirmed:false,note:'Kurgusal ziyaret: taburculuk bilgileri ve günlük bakım ihtiyacı gözden geçirildi. Bakım verenin soruları kaydedildi. Yeni sorun bildirilmedi. Tıbbi girişim uygulanmış olarak kaydedilmedi.'};}
const api={SERVICES,today,validDate,future,fresh,profileError,submit,planError,savePlan,acknowledge,visitError,addVisit,currentVisits,addUpdate,followupError,saveFollowup,reopen,example,examplePlan,exampleVisit};if(typeof module!=='undefined')module.exports=api;else root.HomeCare=api;
})(typeof window!=='undefined'?window:globalThis);
</script><script>(()=>{'use strict';const M=HomeCare,$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state=M.fresh(),view='home',pane='plan',step=1,draft={},pdraft=null,vdraft=null,fdraft=null,guide=false;
const name=id=>M.SERVICES.find(s=>s[0]===id)?.[1]||id,date=d=>M.validDate(d)?d.split('-').reverse().join('.'):'';
const btn=(a,t,c='')=>`<button type="button" class="btn ${c}" data-action="${a}">${t}</button>`;
function field(id,label,type='text',v='',attrs=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" value="${esc(v)}" ${attrs}></div>`;}
function ta(id,label,v='',attrs=''){return `<div class="field"><label for="${id}">${label}</label><textarea id="${id}" name="${id}" ${attrs}>${esc(v)}</textarea></div>`;}
function sel(id,label,opts,v='',attrs=''){return `<div class="field"><label for="${id}">${label}</label><select id="${id}" name="${id}" ${attrs}><option value="">Seçiniz</option>${opts.map(([val,t])=>`<option value="${val}" ${val===v?'selected':''}>${t}</option>`).join('')}</select></div>`;}
const yn=[['no','Hayır'],['yes','Evet'],['unknown','Emin değilim']];
function head(eye,title,sub='',action=''){return `<div class="page-head"><div><div class="eyebrow">${eye}</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`;}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,6000);}
function render(){
 $('#header').innerHTML=`<a href="#" class="brand" data-action="home"><img src="logo.png" alt="HELUNEXA"></a><nav class="nav" aria-label="Ana menü">${btn('patient','Hasta Girişi','secondary')}${btn('doctor','Hekim Girişi','secondary')}</nav>`;
 $('#main').innerHTML=(guide?`<aside class="guide"><div class="row"><b>EVDE BAKIM · ÖRNEK SENARYO</b><button class="text" data-action="start">Yeniden başlat ↻</button></div><p>${!state.submitted?'Hazır başvuruyu inceleyip gönderin.':!state.plan?'Hekim ekranında bakım planını oluşturun.':!state.ack?'Hasta ekranında ziyaret planını inceleyin.':!M.currentVisits(state).length?'Hekim panelindeki “Ziyaret kaydı” adımından örnek ekip kaydını ekleyin.':!state.followup?'Hekim panelindeki “Takip” adımından sonraki planı iletin.':'Ziyaret ve sonraki takip planı hasta ekranında görülebilir.'}</p></aside>`:'')+(view==='home'?home():view==='patient'?patient():view==='review'?review():view==='doctor'?doctor():tracking());$('#main').focus({preventScroll:true});window.scrollTo(0,0);
}
function home(){return `<section class="hero"><div class="eyebrow">MODÜL 06 · EVDE BAKIM HİZMETLERİ</div><h1>Evde bakımda,<br>her adım takipte.</h1><p class="muted">Bakım ihtiyacınızı paylaşın. Hekiminizin oluşturduğu planı, ekip ziyaretlerini ve sonraki adımları tek yerden görün.</p><div class="entry-grid"><button class="entry" data-action="patient"><span class="icon">↗</span><strong>Hasta / Yakını Girişi</strong><span>Başvuru ve bakım takibi</span></button><button class="entry" data-action="doctor"><span class="icon">✳</span><strong>Hekim Girişi</strong><span>Bakım planı ve ekip kayıtları</span></button></div><div class="actions">${btn('start','2 dakikalık sunumu başlat →','soft')}<span class="mini">Örnek hesaplar · Kurgusal veriler</span></div></section><section class="catalog" aria-label="Bakım alanları">${M.SERVICES.map((s,i)=>`<article class="area"><div class="eyebrow">0${i+1} / BAKIM ALANI</div><h3>${s[1]}</h3><p>${s[2]}</p></article>`).join('')}</section><p class="mini" style="margin-top:24px">Evde bakım başvuru ve takip demosu. Hizmet uygunluğu ve kapsamı ilgili sağlık ekibince belirlenir.</p><p class="notice">Acil durumlarda bu başvuruyu beklemeyin; <a href="tel:112">112’yi arayın</a>.</p>`;}
function emergencyNotice(){return '<strong>Acil yardım gereksinimi varsa başvuruyu beklemeyin.</strong> 112’yi arayın. Bu ekran acil çağrı veya ekip yönlendirmesi yapmaz.';}
function side(){return `<aside class="card side"><div class="eyebrow">BİRLİKTE PLANLAYALIM</div><h3>Bakım ihtiyacından takibe.</h3><ol><li>Hasta veya yakını başvursun.</li><li>Hekim planı oluştursun.</li><li>Ekip ziyaretini kaydetsin.</li><li>Sonraki adım görünür olsun.</li></ol><p>Bu demo 18 yaş ve üzeri hastalar içindir.</p></aside>`;}
function patient(){if(state.submitted)return tracking();let body;if(step===1){body=`<h2>Bakım alacak kişiyi tanıyalım.</h2><div class="form-grid">${field('name','Hasta / başvuru adı · İsteğe bağlı','text',draft.name)}${field('age','Hasta yaşı','number',draft.age,'required min="18" max="120" step="1"')}${sel('applicant','Başvuruyu kim yapıyor?',[['self','Kendim için'],['relative','Hasta yakını / bakım veren']],draft.applicant,'required')}${sel('urgent','Şu anda acil yardım gerektiren bir durum var mı?',yn,draft.urgent,'required')}</div><p class="mini" style="margin-top:15px">Örneğin ciddi nefes darlığı, bilinç kaybı veya göğüs ağrısı.</p><div id="urgentNotice" class="notice urgent" ${draft.urgent==='yes'||draft.urgent==='unknown'?'':'hidden'}>${emergencyNotice()}</div><section id="carerSection" ${draft.applicant==='relative'?'':'hidden'}>${field('carer','Başvuran yakının adı','text',draft.carer)}${field('relationship','Yakınlık / bakım ilişkisi','text',draft.relationship)}<label class="check"><input type="checkbox" name="authorized" ${draft.authorized?'checked':''}><span>Bu başvuru için hasta bilgilerini paylaşma yetkim bulunduğunu beyan ediyorum.</span></label></section>${ta('history','Bilinen hastalıklar, yakın tarihli taburculuk ve önemli öykü · Varsa',draft.history)}${ta('medicines','İlaçlar ve varsa mevcut bakım / tedavi planı',draft.medicines)}${field('allergy','Bilinen alerjiler · Varsa','text',draft.allergy)}<div class="actions">${btn('home','Geri','secondary')}<button class="btn" type="submit" id="nextStep" ${draft.urgent==='yes'?'disabled':''}>Bakım ihtiyacına geç →</button></div>`;
 }else body=`<h2>Nasıl bir desteğe ihtiyaç var?</h2><div class="choices">${M.SERVICES.map(s=>`<label class="choice"><input type="checkbox" name="needs" value="${s[0]}" ${(draft.needs||[]).includes(s[0])?'checked':''}><span>${s[1]}</span></label>`).join('')}</div>${ta('request','Bakım ihtiyacınızı kısaca açıklayın',draft.request,'required')}${sel('mobility','Günlük hareket durumu · İsteğe bağlı',[['Bağımsız','Bağımsız'],['Destekle hareket ediyor','Destekle hareket ediyor'],['Büyük ölçüde yatağa bağımlı','Büyük ölçüde yatağa bağımlı'],['Belirsiz','Belirsiz']],draft.mobility)}${ta('support','Evde destek olan kişi ve günlük bakım ihtiyaçları · Varsa',draft.support)}${field('location','İl / ilçe · Demo için örnek bilgi','text',draft.location)}${ta('access','Ev ortamı, erişim veya ekipman ihtiyacı · Varsa',draft.access)}${field('preference','Görüşme / ziyaret için uygun zaman · Tercih','text',draft.preference)}<p class="mini">Zaman tercihi kesinleşmiş randevu değildir. Demoya gerçek adres veya telefon yazmayın.</p><div class="actions">${btn('back','Geri','secondary')}<button class="btn" type="submit">Başvurumu incele →</button></div>`;
 return head('HASTA / YAKINI BAŞVURUSU','Bakım ihtiyacınızı paylaşın.','Kısa bilgilerle başlayalım.',btn('example','Örnek doldur','secondary'))+`<div class="grid"><form class="card" id="patientForm">${body}</form>${side()}</div>`;
}
function summary(p){return `<dl class="summary"><div><dt>Hasta</dt><dd>${esc(p.name||'İsimsiz başvuru')} · ${esc(p.age)} yaş</dd></div><div><dt>Başvuran</dt><dd>${p.applicant==='self'?'Kendisi':esc(p.carer)+' · '+esc(p.relationship)}</dd></div><div class="wide"><dt>Bakım ihtiyacı</dt><dd>${p.needs.map(name).map(esc).join(', ')}</dd></div><div class="wide"><dt>Açıklama</dt><dd>${esc(p.request)}</dd></div></dl><details><summary>Paylaşılan sağlık ve bakım bilgileri</summary><dl class="summary">${[['Acil yardım gereksinimi',p.urgent==='no'?'Bildirilmedi':'Belirsiz'],['Öykü / taburculuk',p.history],['İlaçlar / mevcut bakım planı',p.medicines],['Alerjiler',p.allergy],['Hareket durumu',p.mobility],['Bakım desteği',p.support],['İl / ilçe',p.location],['Ev ortamı / ekipman',p.access],['Zaman tercihi',p.preference]].map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v||'Belirtilmedi')}</dd></div>`).join('')}</dl></details>`;}
function review(){return head('KONTROL VE GÖNDERİM','Başvurunuzu kontrol edin.','Bilgileriniz hekim değerlendirmesine iletilecek.')+`<section class="card">${summary(draft)}<div class="actions">${btn('edit','Düzenle','secondary')}${btn('send','Başvuruyu gönder →')}</div></section>`;}
function doctor(){if(!state.submitted)return head('HEKİM PANELİ','Bakım başvuruları.','Henüz iletilmiş başvuru yok.')+`<section class="card empty"><h2>İlk başvuruyu bekliyoruz.</h2>${btn('exampleSubmit','Örnek başvuru yükle','soft')}</section>`;return head('HEKİM VE BAKIM EKİBİ','Planlayın, kaydedin, takip edin.','Başvuru ve ekip kayıtları aynı dosyada.',btn('tracking','Hasta ekranını gör','secondary'))+`<section class="card">${summary(state.profile)}</section><nav class="row" aria-label="Bakım dosyası adımları" style="margin-bottom:24px">${btn('panePlan','1 · Başvuru ve plan',pane==='plan'?'':'secondary')}${btn('paneVisit','2 · Ziyaret kaydı',pane==='visit'?'':'secondary')}${btn('paneFollow','3 · Takip',pane==='follow'?'':'secondary')}</nav>`+(pane==='plan'?planForm():pane==='visit'?visitForm():followForm())+`<details><summary>İşlem geçmişi</summary>${history()}</details>`;}
function planForm(){const p=pdraft||state.plan||{};return `<form id="planForm" class="card"><div class="row" style="justify-content:space-between"><h2>Hekim bakım planı</h2>${btn('examplePlan','Örnek planı doldur','secondary')}</div>${field('doctor','Değerlendiren hekim','text',p.doctor,'required')}${sel('decision','Sonraki adım',[['visit','Evde ilk değerlendirme / bakım ziyareti'],['info','Ek bilgi / mevcut rapor iste'],['refer','Sağlık kuruluşunda değerlendirme']],p.decision,'required')}${ta('planNote','Bakım planı ve kullanıcıya iletilecek sonraki adım',p.note,'required')}${field('team','Sorumlu ekip / birim','text',p.team,'required')}${field('planDate','Önerilen ziyaret / yeniden değerlendirme tarihi','date',p.date,'required min="'+M.today()+'"')}<label class="check"><input type="checkbox" name="reviewed" ${p.reviewed?'checked':''} required><span>Başvuruyu ve paylaşılan sağlık bilgilerini inceledim; uygun sonraki adımı belirledim.</span></label>${state.plan?'<p class="mini">Yeni plan kaydedilince önceki ziyaretler geçmişte korunur; yeni plan için yeniden kayıt gerekir.</p>':''}<button class="btn" type="submit">Planı kaydet ve kullanıcıya ilet →</button></form>`;}
function visitForm(){if(state.plan?.decision!=='visit'||!state.ack)return `<section class="card"><h2>Ziyaret kaydı henüz açılamaz.</h2><p>Önce hekim ziyaret planını oluştursun; kullanıcı planı gördüğünü belirttikten sonra ekip kaydı eklenebilir.</p></section>`;const v=vdraft||{};return `<form id="visitForm" class="card"><div class="row" style="justify-content:space-between"><h2>Bakım ekibi ziyaret kaydı</h2>${guide?btn('exampleVisit','Örnek ziyareti doldur','secondary'):''}</div><span class="badge">Güncel plan · ${state.version}</span>${field('staff','Kaydı oluşturan sağlık çalışanı','text',v.staff,'required')}${sel('role','Görevi',['Hekim','Hemşire','Fizyoterapist','Diğer sağlık çalışanı'].map(x=>[x,x]),v.role,'required')}${field('visitDate','Ziyaret tarihi','date',v.date,'required min="'+state.plan.created+'" max="'+M.today()+'"')}${sel('outcome','Ziyaret durumu',[['done','Ziyaret gerçekleştirildi'],['notdone','Ziyaret gerçekleştirilemedi']],v.outcome,'required')}${ta('visitNote','Gerçekleşen değerlendirme / bakım, gözlemler veya gerçekleşmeme nedeni',v.note,'required')}${sel('change','Yeni sorun veya bakım planını etkileyen değişiklik var mı?',yn,v.change,'required')}<label class="check"><input type="checkbox" name="confirmed" ${v.confirmed?'checked':''} required><span>Kayıt, belirtilen ziyaret durumunu ve gerçekleşen değerlendirme / bakımı yansıtır.</span></label><button class="btn" type="submit">Ekip kaydını ekle →</button></form>${visits()}`;}
function updates(){return state.updates.length?`<section class="card"><h2>Hasta / yakını bakım notları</h2>${state.updates.slice().reverse().map(u=>`<article class="visit"><p class="mini">${new Date(u.at).toLocaleString('tr-TR',{timeZone:'Europe/Istanbul'})} · Plan ${u.version}</p><p class="pre">${esc(u.note)}</p></article>`).join('')}</section>`:'';}
function followForm(){if(!M.currentVisits(state).length)return `<section class="card"><h2>Güncel planın ziyaret kaydı bekleniyor.</h2><p>Ziyaret sonrası takip için önce ekip kaydı ekleyin.</p></section>${updates()}${visits()}`;const f=fdraft||state.followup||{};return `${visits()}${updates()}<form id="followForm" class="card"><div class="row" style="justify-content:space-between"><h2>Ziyaret sonrası takip</h2>${guide?btn('exampleFollow','Örnek takibi doldur','secondary'):''}</div>${field('followDoctor','Değerlendiren hekim','text',f.doctor||state.plan.doctor,'required')}${sel('followAction','Sonraki bakım adımı',[['continue','Planlı bakıma devam'],['clarify','Yeniden değerlendirme / ek bilgi'],['refer','Sağlık kuruluşuna yönlendirme']],f.action,'required')}${ta('followNote','Kullanıcıya iletilecek değerlendirme ve takip planı',f.note,'required')}${field('responsible','Takipten sorumlu hekim / ekip','text',f.responsible,'required')}${field('followDate','Sonraki kontrol / değerlendirme tarihi','date',f.date,'required min="'+M.today()+'"')}<label class="check"><input name="followReviewed" type="checkbox" required><span>Ziyaret kayıtlarını ve iletilen bakım notlarını inceledim; sonraki adımı belirledim.</span></label><button class="btn" type="submit">Takip planını kullanıcıya ilet →</button></form>`;}
function visits(){if(!state.visits.length)return '';return `<section class="card"><h2>Ziyaret kayıtları</h2>${state.visits.slice().reverse().map(v=>`<article class="visit"><span class="badge">Plan ${v.version}${v.version!==state.version?' · Geçmiş plan':''}</span><h3 style="margin-top:12px">${date(v.date)} · ${v.outcome==='done'?'Ziyaret gerçekleştirildi':'Ziyaret gerçekleştirilemedi'}</h3><p class="mini">${esc(v.staff)} · ${esc(v.role)}</p><p class="pre">${esc(v.note)}</p><p class="mini">Yeni sorun / değişiklik: ${v.change==='no'?'Bildirilmedi':v.change==='yes'?'Bildirildi':'Belirsiz'}</p></article>`).join('')}</section>`;}
function tracking(){if(!state.submitted)return patient();const p=state.plan,f=state.followup;return head('HASTA / YAKINI PANELİ','Evde bakım planınız.','Başvurudan ziyaret sonrasına kadar aynı yerde.',btn('doctor','Hekim ekranına geç','secondary'))+`<div class="steps"><div class="step active">1 · Başvuru</div><div class="step ${p?'active':''}">2 · Hekim planı</div><div class="step ${M.currentVisits(state).length?'active':''}">3 · Ekip ziyareti</div><div class="step ${f?'active':''}">4 · Takip</div></div><section class="card">${summary(state.profile)}${!p?'<div class="outcome"><h3>Hekim değerlendirmesinde.</h3><p>Sonraki adımınız burada görünecek.</p></div>':`<div class="outcome"><div class="eyebrow">${p.decision==='visit'?'ÖNERİLEN ZİYARET PLANI':p.decision==='info'?'EK BİLGİ / RAPOR BEKLENİYOR':'SAĞLIK KURULUŞUNDA DEĞERLENDİRME'}</div><h3>${esc(p.team)}</h3><p>${esc(p.note)}</p><strong>Tarih: ${date(p.date)}</strong><p class="mini" style="margin-top:12px">Planı oluşturan: ${esc(p.doctor)}</p>${p.decision==='visit'?'<p class="mini">Ziyaretin kesin zamanı ve ekip uygunluğu kurum tarafından ayrıca teyit edilir.</p>':''}</div>${p.decision==='visit'&&!state.ack?`<form id="ackForm"><label class="check"><input type="checkbox" required><span>Hekimin oluşturduğu ziyaret planını gördüm.</span></label><button class="btn" type="submit">Planı gördüm, takibe geç →</button></form>`:''}`}</section>${visits()}${f?`<section class="card"><div class="eyebrow">SONRAKİ ADIMINIZ</div><h2>${f.action==='continue'?'Bakım ve kontrol planınız hazır.':f.action==='refer'?'Sağlık kuruluşunda değerlendirme planlandı.':'Yeniden değerlendirme planlandı.'}</h2><p class="pre">${esc(f.note)}</p><dl class="summary"><div><dt>Kontrol tarihi</dt><dd>${date(f.date)}</dd></div><div><dt>Sorumlu hekim / ekip</dt><dd>${esc(f.responsible)}</dd></div></dl><p class="mini">Bu, sonraki adımın planıdır; bakım sürecinin tamamlandığı anlamına gelmez.</p></section>`:state.visits.length?'<p class="notice">Güncel ziyaret ve bakım notları için hekim değerlendirmesi bekleniyor.</p>':''}<section class="card"><h2>Bakım notu iletin.</h2><p class="mini">Günlük bakım, ekipman veya sonraki adım hakkında eklemek istediklerinizi paylaşın. Demo anlık yanıt veya bildirim göndermez.</p><form id="updateForm">${ta('updateNote','Hekime / bakım ekibine iletilecek not','','required')}<button type="submit" class="btn">Bakım notunu ilet →</button></form></section>${updates()}<p class="notice">${emergencyNotice()}</p><div class="actions">${btn('reopen',p?.decision==='info'?'Bilgilerimi tamamla':'Başvurumu düzenle','secondary')}${btn('home','Ana sayfa','secondary')}</div><details><summary>İşlem geçmişi</summary>${history()}</details>`;}
function history(){return `<div class="timeline">${state.history.map(h=>`<p><b>${esc(h.text)}</b>${new Date(h.at).toLocaleString('tr-TR',{timeZone:'Europe/Istanbul'})}</p>`).join('')}</div>`;}
function capturePatient(){const f=$('#patientForm');if(!f)return;const d=new FormData(f);for(const[k,v]of d)if(k!=='needs')draft[k]=v;if(step===1)draft.authorized=d.has('authorized');if(step===2)draft.needs=d.getAll('needs');}
function captureForms(){if($('#planForm')){const d=new FormData($('#planForm'));pdraft={doctor:d.get('doctor'),decision:d.get('decision'),note:d.get('planNote'),team:d.get('team'),date:d.get('planDate'),reviewed:d.has('reviewed')};}if($('#visitForm')){const d=new FormData($('#visitForm'));vdraft={staff:d.get('staff'),role:d.get('role'),date:d.get('visitDate'),outcome:d.get('outcome'),note:d.get('visitNote'),change:d.get('change'),confirmed:d.has('confirmed')};}if($('#followForm')){const d=new FormData($('#followForm'));fdraft={doctor:d.get('followDoctor'),action:d.get('followAction'),note:d.get('followNote'),responsible:d.get('responsible'),date:d.get('followDate'),reviewed:d.has('followReviewed')};}}
function about(){const d=$('#dialog');d.innerHTML=`<h2>Bakım sürecini birlikte takip edin.</h2><p>Hasta / yakını başvurusu, hekim planı, bakım ekibi ziyaret kaydı ve sonraki takip adımını gösteren demo.</p><p class="mini">Yalnızca kurgusal bilgilerle deneyin. Hasta/hekim geçişleri rol simülasyonudur. Gerçek hizmet kabulü, kimlik veya temsil yetkisi doğrulaması, tıbbi onam, randevu teyidi, ekip sevki, reçete, bildirim ve ödeme işlemi yapılmaz. Kayıtlar bu sekmede tutulur.</p><details><summary>Bilgilendirme kaynakları</summary><p><a href="https://usakeah.saglik.gov.tr/TR-246735/evde-saglik-hizmetleri.html" target="_blank" rel="noopener">Sağlık Bakanlığı · Evde sağlık hizmetleri ↗</a></p><p><a href="https://istanbul.saglik.gov.tr/TR-56073/112-acil-saglik-hizmetleri.html" target="_blank" rel="noopener">Sağlık Bakanlığı · 112 Acil Sağlık ↗</a></p><p class="mini">Genel süreç bilgisi ve acil yardım yönlendirmesi için. Demo kamu hizmetine başvuru kanalı veya hizmet uygunluk algoritması değildir.</p></details>${btn('close','Kapat')}`;d.showModal();}
document.addEventListener('change',e=>{if(e.target.id==='applicant')$('#carerSection').hidden=e.target.value!=='relative';if(e.target.id==='urgent'){$('#urgentNotice').hidden=!['yes','unknown'].includes(e.target.value);$('#nextStep').disabled=e.target.value==='yes';}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();const a=el.dataset.action;try{capturePatient();captureForms();if(a==='home')view='home';else if(a==='patient'||a==='tracking')view=state.submitted?'track':'patient';else if(a==='doctor'){view='doctor';pane='plan';}else if(a==='panePlan')pane='plan';else if(a==='paneVisit')pane='visit';else if(a==='paneFollow')pane='follow';
 else if(a==='start'){state=M.fresh();draft=M.example();pdraft=vdraft=fdraft=null;guide=true;step=1;view='patient';pane='plan';}
 else if(a==='example'){draft=M.example();step=1;view='patient';}else if(a==='back'){step=1;}else if(a==='edit'){step=1;view='patient';}
 else if(a==='send'){M.submit(state,draft);pdraft=vdraft=fdraft=null;view='track';toast('Başvurunuz iletildi.');}
 else if(a==='exampleSubmit'){state=M.fresh();draft=M.example();M.submit(state,draft);pdraft=vdraft=fdraft=null;view='doctor';pane='plan';}
 else if(a==='examplePlan'){pdraft=M.examplePlan();}else if(a==='exampleVisit'){vdraft=M.exampleVisit();}
 else if(a==='exampleFollow'){fdraft={doctor:state.plan.doctor,action:'continue',note:'Kurgusal takip: bakım verenin soruları sonraki ekip görüşmesinde yeniden ele alınacak; bakım ihtiyacı kontrol tarihinde gözden geçirilecek.',responsible:state.plan.team,date:M.future(7),reviewed:false};}
 else if(a==='reopen'){if(state.plan&&!confirm('Başvuru yeniden düzenlenecek. Mevcut plan geçersiz olacak; önceki ziyaret kayıtları geçmişte korunacak. Devam edilsin mi?'))return;draft=JSON.parse(JSON.stringify(state.profile));M.reopen(state);pdraft=vdraft=fdraft=null;view='patient';step=1;}
 else if(a==='about'){about();return;}else if(a==='close'){$('#dialog').close();return;}render();}catch(err){toast(err.message);}});
document.addEventListener('submit',e=>{e.preventDefault();try{if(e.target.id==='patientForm'){capturePatient();if(step===1){if(draft.urgent==='yes')throw Error('Acil durumda 112’yi arayın; başvuruyu beklemeyin.');if(!draft.age||!draft.applicant||!draft.urgent)throw Error('Yaş, başvuran ve acil yardım durumunu tamamlayın.');if(draft.applicant==='relative'&&(!draft.carer?.trim()||!draft.relationship?.trim()||!draft.authorized))throw Error('Başvuran yakının adı, yakınlığı ve paylaşım beyanını tamamlayın.');step=2;}else{const err=M.profileError(draft);if(err)throw Error(err);view='review';}}
 else if(e.target.id==='planForm'){captureForms();const err=M.planError(state,pdraft);if(err)throw Error(err);if(state.plan&&!confirm('Yeni plan kaydedilecek; önceki ziyaretler geçmişte korunacak ve kullanıcı yeni planı yeniden görecek. Devam edilsin mi?'))return;M.savePlan(state,pdraft);pdraft=vdraft=fdraft=null;view='track';toast('Hekim planı iletildi.');}
 else if(e.target.id==='ackForm'){M.acknowledge(state);toast('Planı gördüğünüz kaydedildi.');}
 else if(e.target.id==='visitForm'){captureForms();M.addVisit(state,vdraft);vdraft=fdraft=null;pane='follow';toast('Ekip kaydı eklendi.');}
 else if(e.target.id==='followForm'){captureForms();M.saveFollowup(state,fdraft);fdraft=null;view='track';toast('Takip planı iletildi.');}
 else if(e.target.id==='updateForm'){M.addUpdate(state,{note:new FormData(e.target).get('updateNote')});fdraft=null;view='track';toast('Bakım notu iletildi; değerlendirme bekleniyor.');}render();}catch(err){toast(err.message);}});
render();})();
</script>
</body>
</html>
