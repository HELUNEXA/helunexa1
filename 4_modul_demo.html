<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HELUNEXA · Longevity</title><style>

:16px}.hero{max-width:850px;padding:26px 0}.hero p{font-size:20px;max-width:650px}.entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.entry{border:1px solid var(--line);background:white;border-radius:20px;padding:28px;text-align:left;color:var(--ink);transition:0.2s}.entry strong{display:block;font-size:23px;margin:14px 0 7px}.entry span{display:block;color:var(--muted)}.entry:hover{border-color:var(--green);box-shadow:0 10px 25px rgba(16,185,129,0.1);transform:translateY(-2px)}.entry .icon{font-size:28px;color:var(--green)}.actions{justify-content:space-between;margin:26px 0 0}.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:35px}.area{border:1px solid var(--line);border-radius:18px;padding:24px;background:white}.area .eyebrow{margin-bottom:12px}.area h3{font-size:19px}.area p{font-size:14px;color:var(--muted)}details{border-top:1px solid var(--line);padding:18px 0;margin-top:16px}summary{cursor:pointer;color:var(--green);font-weight:600}details p{margin:16px 0 0}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px}.page-head h1{font-size:36px}.page-head p{color:var(--muted)}.card{border:1px solid var(--line);border-radius:22px;background:white;padding:30px;margin-bottom:22px;box-shadow:0 4px 6px rgba(0,0,0,0.02);}.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:25px;align-items:start}.side{background:var(--pale);border-color:#d1fae5;}.side p,.side li{font-size:14px;color:var(--muted)}.side li{margin:14px 0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{margin-bottom:22px}.form-grid .field{margin:0}label{display:block;font-weight:600;margin-bottom:8px}input:not([type=checkbox]),select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:13px;min-height:48px;background:white;color:var(--ink);font-size:16px;outline:none;transition:0.2s}input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--pale);}textarea{min-height:95px;resize:vertical}.check{display:flex;gap:12px;font-weight:500;margin:20px 0;align-items:flex-start;font-size:14px;cursor:pointer;}.check input{width:22px;height:22px;flex:0 0 22px;margin-top:2px;accent-color:var(--green);cursor:pointer;}.choice{display:flex;gap:12px;padding:15px;border:1px solid var(--line);border-radius:12px;font-weight:500}.choice:has(input:checked){background:var(--pale);border-color:var(--green)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.choice input{width:20px;height:20px;accent-color:var(--green)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:22px 0 30px}.step{border-top:3px solid var(--line);padding-top:10px;color:var(--muted);font-size:13px}.step.active{border-color:var(--green);color:var(--ink);font-weight:bold;}.guide{background:var(--pale);border:1px solid #a7f3d0;padding:18px 24px;border-radius:16px;margin-bottom:28px}.guide p{font-size:14px;margin:8px 0 0;color:var(--green-dark);font-weight:500;}.guide .row{justify-content:space-between}.summary{display:grid;grid-template-columns:1fr 1fr;gap:20px}.summary dt{font-size:13px;color:var(--muted);margin-bottom:6px}.summary dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:500;}.summary .wide{grid-column:1/-1}.notice{padding:18px 20px;border-radius:14px;background:var(--pale);font-size:14px;margin:20px 0;border:1px solid #d1fae5;}.warn{background:#fffbeb;color:var(--warn);border-color:#fde68a;}.outcome{background:var(--pale);border-left:4px solid var(--green);border-radius:14px;padding:24px;margin:24px 0}.outcome p,.pre{white-space:pre-wrap;overflow-wrap:anywhere}.badge{display:inline-block;background:var(--pale);color:var(--green-dark);padding:6px 12px;border-radius:24px;font-size:12px;font-weight:bold;border:1px solid #a7f3d0;}.result{border-top:1px solid var(--line);padding:24px 0}.timeline p{border-left:2px solid var(--line);padding-left:18px;font-size:14px;margin:20px 0}.timeline b{display:block}.empty{text-align:center;padding:45px 20px}footer{max-width:1180px;margin:auto;border-top:1px solid var(--line);display:flex;gap:20px;justify-content:space-between;align-items:center;padding:25px 24px 40px;color:var(--muted);font-size:12px}dialog{border:1px solid var(--line);border-radius:20px;max-width:620px;width:calc(100% - 32px);padding:28px;color:var(--ink);box-shadow:0 20px 40px rgba(0,0,0,0.2);}dialog::backdrop{background:rgba(15,23,42,0.5);backdrop-filter:blur(4px);}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 30px);padding:16px 24px;border-radius:13px;background:var(--ink);color:white;z-index:100;box-shadow:0 6px 30px rgba(0,0,0,0.2);font-weight:bold;}section[hidden]{display:none}.reference-list li{margin:14px 0}.spacer{height:22px}@media(max-width:820px){.grid{grid-template-columns:1fr}.side{display:none}.catalog{grid-template-columns:1fr 1fr}.page-head h1{font-size:31px}}@media(max-width:560px){header{padding:16px 18px;flex-wrap:wrap;gap:12px}.brand{font-size:21px}.nav{gap:8px}.nav .btn{font-size:13px;padding:10px 12px;min-height:42px}main{padding:28px 18px 40px}.hero{padding:12px 0}.hero h1{font-size:36px}.hero p{font-size:17px}.entry-grid,.form-grid,.choices,.grid2,.catalog,.summary{grid-template-columns:1fr}.summary .wide{grid-column:auto}.entry,.area,.card{padding:21px}.card{border-radius:18px}.page-head{flex-direction:column;gap:6px}.steps{gap:9px}.step{font-size:11px}.actions{align-items:stretch}.actions .btn{flex:1}.guide{padding:17px}footer{align-items:flex-start;flex-direction:column;padding:22px 18px}.hero .mini{font-size:12px}}
</style></head><body><noscript><p>Bu modül JavaScript etkin bir tarayıcıda çalışır.</p></noscript><header id="header"></header><main id="main" tabindex="-1"></main><footer><span>HELUNEXA · Modül 04 · Longevity</span><span>Bilgiler bu sekmede tutulur</span><button class="text" data-action="about">Modül hakkında ↗</button></footer><dialog id="dialog"></dialog><div id="toast" role="status" hidden></div><script>(function(root){
 'use strict';
 const AREAS=[
 {id:'move',name:'Hareket ve kas gücü',icon:'↗',text:'Günlük hareketi, güç ve dengeyi koruma alışkanlıklarını ele alır.'},
 {id:'food',name:'Beslenme ve metabolik sağlık',icon:'◒',text:'Beslenme düzenini ve mevcut metabolik sağlık bilgilerini birlikte ele alır.'},
 {id:'sleep',name:'Uyku ve dinlenme',icon:'☾',text:'Uyku düzenini, dinlenmiş hissetmeyi ve günlük yaşama etkisini ele alır.'},
 {id:'mind',name:'Zihinsel ve sosyal iyilik hâli',icon:'✳',text:'Zihinsel uğraşları, sosyal bağları ve kişinin iyi hissetmesini destekleyen alışkanlıkları ele alır.'},
 {id:'function',name:'Günlük işlevler ve bağımsızlık',icon:'⌁',text:'Yürüme, günlük işler, görme ve işitme gibi alanlarda kişinin belirttiği gereksinimleri ele alır.'},
 {id:'prevention',name:'Koruyucu sağlık ve alışkanlıklar',icon:'◇',text:'Tütün ve alkol kullanımı, aşı ve önceki tarama bilgilerini hekimle gözden geçirmeye yardımcı olur.'}
 ];
 const s=v=>String(v??'').trim();
 function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
 function validDate(d){if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return false;const dt=new Date(d+'T12:00:00Z');return Number.isFinite(+dt)&&dt.toISOString().slice(0,10)===d;}
 function fresh(){return {profile:null,submitted:false,plan:null,entries:[],history:[]};}
 function profileError(p){
  if(!Number.isInteger(Number(p.age))||Number(p.age)<18||Number(p.age)>120)return 'Yaşınızı 18–120 arasında girin.';
  if(!['no','yes'].includes(p.symptoms))return 'Yeni veya artan şikâyet durumunu belirtin.';
  if(p.symptoms==='yes'&&!s(p.symptomNote))return 'Şikâyetinizi kısaca belirtin.';
  if(!Array.isArray(p.priorities)||p.priorities.length<1||p.priorities.length>3||new Set(p.priorities).size!==p.priorities.length||p.priorities.some(id=>!AREAS.some(a=>a.id===id)))return 'Bir ile üç öncelik seçin.';
  if(!s(p.wish))return 'Sizin için önemli olan hedefi kısaca yazın.';
  if(p.minutes!==''&&p.minutes!=null&&(!Number.isFinite(Number(p.minutes))||Number(p.minutes)<0||Number(p.minutes)>10080))return 'Haftalık hareket süresini kontrol edin.';
  if(p.sleep!==''&&p.sleep!=null&&(!Number.isFinite(Number(p.sleep))||Number(p.sleep)<0||Number(p.sleep)>24))return 'Uyku süresini kontrol edin.';
  return '';
 }
 function log(st,text){st.history.push({at:new Date().toISOString(),text});}
 function submit(st,p){const err=profileError(p);if(err)throw Error(err);st.profile=JSON.parse(JSON.stringify(p));st.submitted=true;st.plan=null;st.entries=[];log(st,'Başvuru hekim değerlendirmesine gönderildi.');}
 function planError(st,p){
  if(!st.submitted)return 'Önce başvuru gönderilmeli.';
  if(!s(p.doctor))return 'Hekim adını girin.';
  if(!p.reviewed)return 'Paylaşılan bilgileri değerlendirdiğinizi onaylayın.';
  if(!['plan','info','visit'].includes(p.decision))return 'Sonraki adımı seçin.';
  if(!s(p.note))return 'Kullanıcıya iletilecek kısa planı yazın.';
  if(!validDate(p.date)||p.date<today())return 'Bugün veya sonrası için geçerli bir kontrol tarihi seçin.';
  if(p.decision==='plan'){
   if(st.profile.symptoms==='yes')return 'Yeni şikâyet başvurusunda ek bilgi veya muayene adımını seçin.';
   if(!p.goals||p.goals.length<1||p.goals.length>3)return 'Bir ile üç hedef belirleyin.';
   for(const g of p.goals)if(!AREAS.some(a=>a.id===g.area)||!s(g.title)||!Number.isInteger(Number(g.target))||Number(g.target)<1||Number(g.target)>7)return 'Her hedef için alan, açıklama ve haftalık gün sayısını tamamlayın.';
  }
  return '';
 }
 function savePlan(st,p){const err=planError(st,p);if(err)throw Error(err);st.plan=JSON.parse(JSON.stringify(p));if(p.decision!=='plan')st.plan.goals=[];st.entries=[];log(st,'Hekim planı kullanıcıya iletildi.');}
 function entryError(st,e){
  if(!st.plan||st.plan.decision!=='plan')return 'İlerleme kaydı için hekim planı gerekli.';
  if(!validDate(e.date)||e.date>today())return 'Bugün veya öncesinde geçerli bir kayıt tarihi seçin.';
  const start=st.history.filter(x=>x.text==='Hekim planı kullanıcıya iletildi.').at(-1);
  if(start&&e.date<new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(start.at)))return 'Kayıt tarihi plan tarihinden önce olamaz.';
  if(st.entries.some(x=>x.date===e.date))return 'Bu tarih için kayıt var; farklı bir tarih seçin.';
  if(!['no','yes'].includes(e.symptoms))return 'Yeni şikâyet durumunu belirtin.';
  if(e.symptoms==='yes'&&!s(e.note))return 'Yeni şikâyetinizi kısaca belirtin.';
  if(!Array.isArray(e.days)||e.days.length!==st.plan.goals.length||e.days.some(v=>v===''||!Number.isInteger(Number(v))||Number(v)<0||Number(v)>7))return 'Her hedef için 0–7 gün arasında ilerleme girin.';
  return '';
 }
 function addEntry(st,e){const err=entryError(st,e);if(err)throw Error(err);st.entries.push(JSON.parse(JSON.stringify(e)));log(st,'Kullanıcı ilerleme kaydını ekledi.');}
 function reopen(st){st.submitted=false;st.plan=null;st.entries=[];log(st,'Başvuru düzenlemeye açıldı; önceki plan geçersiz kılındı.');}
 function example(){return {name:'Deniz Örnek',age:'52',sex:'Belirtmek istemiyorum',symptoms:'no',symptomNote:'',history:'Bilinen kronik hastalık ve operasyon yok.',medicines:'Düzenli ilaç veya takviye yok.',pregnancy:'Geçerli değil.',previous:'Önceki tetkik ve aşı bilgilerini görüşmede paylaşacağım.',minutes:'60',sleep:'6.5',food:'Evde besleniyorum; öğün saatlerim düzensiz.',functionNote:'Günlük işlerimi bağımsız yapıyorum. Düşme öyküsü yok.',tobacco:'Kullanmıyorum',alcohol:'Kullanmıyorum',social:'Haftada bir arkadaşlarımla görüşüyorum.',priorities:['move','sleep','food'],wish:'Günlük hareketimi artırmak, düzenli uyumak ve daha düzenli beslenmek istiyorum.'};}
 function examplePlan(){return {doctor:'Dr. Örnek Hekim',reviewed:false,decision:'plan',date:today(),note:'Aşağıdaki küçük adımları deneyin; kontrol görüşmesinde uygulanabilirliğini birlikte değerlendirelim.',tests:'',goals:[{area:'move',title:'Uygun bulduğumuz tempoda kısa yürüyüşe zaman ayırmak',target:'3'},{area:'sleep',title:'Belirlediğimiz saatte uyku hazırlığına başlamak',target:'5'},{area:'food',title:'Ana öğünleri belirlediğimiz düzende planlamak',target:'5'}]};}
 const api={AREAS,today,validDate,fresh,profileError,submit,planError,savePlan,entryError,addEntry,reopen,example,examplePlan};if(typeof module!=='undefined')module.exports=api;else root.Longevity=api;
})(typeof window!=='undefined'?window:globalThis);
</script><script>(()=>{'use strict';const M=Longevity;let state=M.fresh(),view='home',step=1,draft={},planDraft=null,guide=false;const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const area=id=>M.AREAS.find(a=>a.id===id)?.name||id;
const btn=(action,label,cls='')=>`<button class="btn ${cls}" data-action="${action}">${label}</button>`;
function toast(msg){$('#toast').textContent=msg;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,5000);}
const date=v=>M.validDate(v)?v.split('-').reverse().join('.'):'';
function field(id,label,type='text',value='',extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`;}
function ta(id,label,value='',extra=''){return `<div class="field"><label for="${id}">${label}</label><textarea id="${id}" name="${id}" ${extra}>${esc(value)}</textarea></div>`;}
function select(id,label,opts,val='',extra=''){return `<div class="field"><label for="${id}">${label}</label><select id="${id}" name="${id}" ${extra}><option value="">Seçiniz</option>${opts.map(o=>{let [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===val?'selected':''}>${esc(t)}</option>`;}).join('')}</select></div>`;}
function head(eye,title,sub='',action=''){return `<div class="page-head"><div><div class="eyebrow">${eye}</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`;}
function guideBox(){return guide?`<aside class="guide"><div class="guide-title"><strong>SAĞLIKLI YAŞ ALMA · SÜREÇ</strong><button class="text-button" data-action="restart">Yeniden başlat ↻</button></div><p>${!state.submitted?'Hazır başvuruyu inceleyip gönderin.':!state.plan?'Hekim ekranında hedefleri düzenleyip planı iletin.':'Hasta ekranında haftalık ilerlemeyi kaydedin.'}</p></aside>`:'';}
function sidebar(){return `<aside class="card sidebar"><div class="eyebrow">KÜÇÜK ADIMLAR, DÜZENLİ TAKİP</div><h3>Size uygun bir plan.</h3><ol><li>Önceliklerinizi paylaşın.</li><li>Hekiminizle uygulanabilir hedefler belirleyin.</li><li>Gelişiminizi ve sonraki adımı takip edin.</li></ol><p>18 yaş ve üzeri bireyler için sağlıklı yaş alma başvurusu.</p></aside>`;}
function render(){
 $('#header').innerHTML=`<a href="#" data-action="home" class="brand"><img src="logo.png" alt="HELUNEXA"></a><nav class="nav" aria-label="Ana menü">${btn('patient','Hasta Girişi','secondary')}${btn('doctor','Hekim Girişi','secondary')}</nav>`;
 let html=view==='home'?home():view==='patient'?patient():view==='review'?review():view==='doctor'?doctor():tracking();
 $('#main').innerHTML=guideBox()+html;$('#main').focus({preventScroll:true});window.scrollTo(0,0);
}
function home(){return `<section class="hero"><div class="eyebrow">MODÜL 04 · LONGEVITY / SAĞLIKLI YAŞ ALMA</div><h1>İyi yaş almak,<br>bugünden başlar.</h1><p class="muted">Sizin için önemli olanı paylaşın. Hekiminizle hedeflerinizi belirleyin, küçük adımlarla ilerleyin.</p><div class="entry-grid"><button class="entry" data-action="patient"><span class="entry-icon">↗</span><strong>Hasta Girişi</strong><span>Başvuru ve hedef takibi</span></button><button class="entry" data-action="doctor"><span class="entry-icon">✳</span><strong>Hekim Girişi</strong><span>Değerlendirme ve kişisel plan</span></button></div><div class="actions">${btn('start','Süreci başlat →','soft')}</div></section><section class="area-grid" aria-label="Sağlıklı yaş alma alanları">${M.AREAS.map(a=>`<article class="area"><span class="entry-icon">${a.icon}</span><h3>${a.name}</h3><p>${a.text}</p></article>`).join('')}</section>`;}
function patient(){if(state.submitted){view='tracking';return tracking();}let body='';if(step===1){body=`<h2>Kısaca sizi tanıyalım.</h2><div class="form-grid">${field('name','Başvuru adı','text',draft.name)}${field('age','Yaş','number',draft.age,'required min="18" max="120" step="1"')}${select('sex','Cinsiyet',['Kadın','Erkek','Belirtmek istemiyorum'],draft.sex)}${select('symptoms','Yeni bir şikâyetiniz var mı?',[['no','Hayır'],['yes','Evet']],draft.symptoms,'required')}</div>${ta('symptomNote','Şikâyetiniz varsa belirtin',draft.symptomNote)}${ta('history','Kronik hastalık veya aile öyküsü',draft.history)}${ta('medicines','İlaçlar ve takviyeler',draft.medicines)}${field('pregnancy','Gebelik veya emzirme','text',draft.pregnancy)}${ta('previous','Önceki sonuçlar ve taramalar',draft.previous)}<div class="actions">${btn('home','Geri','secondary')}<button class="btn" type="submit">Alışkanlıklarıma geç →</button></div>`;
 }else if(step===2){body=`<h2>Günlük yaşamınız nasıl?</h2><div class="form-grid">${field('minutes','Haftalık hareket (dakika)','number',draft.minutes,'min="0" max="10080" step="1"')}${field('sleep','Ortalama gece uykusu (saat)','number',draft.sleep,'min="0" max="24" step="0.5"')}${select('tobacco','Tütün kullanımı',['Kullanmıyorum','Kullanıyorum','Bıraktım','Belirtmek istemiyorum'],draft.tobacco)}${select('alcohol','Alkol kullanımı',['Kullanmıyorum','Kullanıyorum','Belirtmek istemiyorum'],draft.alcohol)}</div>${ta('food','Beslenme düzeniniz',draft.food)}${ta('functionNote','Günlük işler ve hareket konusunda eklemek istedikleriniz',draft.functionNote)}${ta('social','Sosyal yaşam ve iyi hissetme',draft.social)}<div class="actions">${btn('back','Geri','secondary')}<button class="btn" type="submit">Önceliklerime geç →</button></div>`;
 }else{body=`<h2>En çok neye odaklanmak istersiniz?</h2><div class="choice-grid">${M.AREAS.map(a=>`<label class="choice"><input type="checkbox" name="priorities" value="${a.id}" ${(draft.priorities||[]).includes(a.id)?'checked':''}><span><strong>${a.name}</strong><small>${a.text}</small></span></label>`).join('')}</div>${ta('wish','Sizin için önemli olan hedef nedir?',draft.wish,'required')}<div class="actions">${btn('back','Geri','secondary')}<button class="btn" type="submit">Başvurumu incele →</button></div>`;}
 return head('HASTA BAŞVURUSU','Size uygun bir başlangıç.','Gereksinimleriniz, alışkanlıklarınız ve öncelikleriniz.',btn('example','Örnek doldur','secondary'))+`<div class="steps">${['Sizi tanıyalım','Günlük yaşam','Öncelikleriniz'].map((x,i)=>`<div class="step ${step===i+1?'active':step>i+1?'done':''}">${i+1} · ${x}</div>`).join('')}</div><div class="grid"><form class="card" id="patientForm">${body}</form>${sidebar()}</div>`;
}
function summary(p){return `<dl class="summary"><div><dt>Başvuru</dt><dd>${esc(p.name||'İsimsiz')} · ${esc(p.age)} yaş</dd></div><div><dt>Öncelikler</dt><dd>${p.priorities.map(area).map(esc).join(', ')}</dd></div><div class="wide"><dt>Kişisel hedef</dt><dd>${esc(p.wish)}</dd></div></dl><details><summary>Paylaşılan sağlık ve yaşam bilgileri</summary><dl class="summary">${[['Cinsiyet',p.sex],['Yeni şikâyet',p.symptoms==='yes'?p.symptomNote:'Yok'],['Hastalık öyküsü',p.history],['İlaçlar',p.medicines],['Gebelik',p.pregnancy],['Önceki taramalar',p.previous],['Haftalık hareket',p.minutes!==''&&p.minutes!=null?p.minutes+' dakika':''],['Uyku',p.sleep!==''&&p.sleep!=null?p.sleep+' saat':''],['Beslenme',p.food],['Günlük işlevler',p.functionNote],['Tütün',p.tobacco],['Alkol',p.alcohol],['Sosyal yaşam',p.social]].map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v||'Belirtilmedi')}</dd></div>`).join('')}</dl></details>`;}
function review(){return head('KONTROL VE GÖNDERİM','Başvurunuzu kontrol edin.','Bilgileriniz hekim değerlendirmesine iletilecek.')+`<article class="card">${summary(draft)}${draft.symptoms==='yes'?'<p class="notice">Şikâyetiniz başvuruyla birlikte hekime iletilir.</p>':''}<div class="actions">${btn('edit','Düzenle','secondary')}${btn('send','Başvuruyu gönder →')}</div></article>`;}
function goalFields(g={},i){return `<section class="goal-edit"><h3>Hedef ${i+1}${i?' · İsteğe bağlı':''}</h3>${select('area'+i,'Sağlık alanı',M.AREAS.map(a=>[a.id,a.name]),g.area)}${field('title'+i,'Birlikte belirlenen adım','text',g.title,'maxlength="240"')}${field('target'+i,'Haftalık hedef · Gün','number',g.target,'min="1" max="7" step="1"')}</section>`;}
function doctor(){if(!state.submitted)return head('HEKİM PANELİ','Başvurularınız.','Henüz gönderilmiş başvuru yok.')+`<div class="card empty"><h2>İlk başvuruyu bekliyoruz.</h2>${btn('exampleSubmit','Örnek başvuru yükle','soft')}</div>`;
 const p=state.profile,d=planDraft||state.plan||{goals:[]};return head('HEKİM PANELİ','Öncelikleri kişisel plana dönüştürün.','En fazla üç uygulanabilir hedef, tek bir takip planı.')+`<div class="card">${summary(p)}</div>${p.symptoms==='yes'?'<p class="notice">Yeni şikâyet bildirildi. Sonraki adım olarak ek bilgi veya muayene seçin.</p>':''}${state.plan?`<p class="notice">İletilmiş bir plan var. Değişiklikleri kaydetmek önceki ilerleme kayıtlarını sıfırlar.</p>`:''}<form class="card" id="planForm">${field('doctor','Değerlendiren hekim','text',d.doctor,'required')}${select('decision','Sonraki adım',[['plan','Kişisel hedef planı'],['info','Ek bilgi iste'],['visit','Muayene / ilgili değerlendirme']],d.decision,'required')}${ta('note','Kullanıcıya iletilecek kısa plan',d.note,'required')}${field('date','Kontrol tarihi','date',d.date,'required min="'+M.today()+'"')}<div id="goalsSection" ${d.decision!=='plan'?'hidden':''}><div class="divider"></div><div class="page-head"><h2>Küçük, ölçülebilir adımlar.</h2>${btn('examplePlan','Örnek hedefleri doldur','secondary')}</div>${[0,1,2].map(i=>goalFields(d.goals?.[i],i)).join('')}${ta('tests','Ek değerlendirme planı',d.tests)}</div><label class="check"><input type="checkbox" name="reviewed" ${d.reviewed?'checked':''} required><span>Paylaşılan sağlık bilgilerini değerlendirdim.</span></label><div class="actions">${btn('tracking','Hasta ekranını gör','secondary')}<button class="btn" type="submit">Planı kaydet ve kullanıcıya ilet →</button></div></form>${doctorEntries()}<details><summary>İşlem geçmişi</summary>${history()}</details>`;}
function doctorEntries(){if(!state.entries.length)return '';return `<section class="card"><h2>Kullanıcının ilerleme kayıtları</h2>${state.entries.slice().reverse().map(e=>`<article class="entry-record"><h3>${date(e.date)}</h3>${state.plan.goals.map((g,i)=>`<p>${esc(g.title)}: <strong>${e.days[i]} / ${g.target} gün</strong></p>`).join('')}<p>Yeni şikâyet: ${e.symptoms==='yes'?'Bildirildi':'Yok'}</p>${e.note?`<p class="prewrap">${esc(e.note)}</p>`:''}</article>`).join('')}</section>`;}
function history(){return `<div class="timeline">${state.history.map(x=>`<p><strong>${esc(x.text)}</strong>${new Date(x.at).toLocaleString('tr-TR',{timeZone:'Europe/Istanbul'})}</p>`).join('')}</div>`;}
function tracking(){if(!state.submitted)return patient();const p=state.plan;return head('HASTA PANELİ','Sağlıklı yaş alma planınız.','Hedefleriniz ve sonraki adımınız bir arada.',btn('doctor','Hekim ekranına geç','secondary'))+`<div class="steps"><div class="step done">1 · Başvuru iletildi</div><div class="step ${p?'done':'active'}">2 · Hekim planı</div><div class="step ${p?.decision==='plan'?'active':''}">3 · Hedef takibi</div></div><div class="card"><span class="badge">${p?'Hekim planı iletildi':'Hekim değerlendirmesinde'}</span>${summary(state.profile)}${!p?`<div class="outcome"><h3>Başvurunuz iletildi.</h3><p>Hekiminizin değerlendirmesi burada görünecek.</p></div>`:`<div class="outcome"><div class="eyebrow">${p.decision==='plan'?'KİŞİSEL PLANINIZ':p.decision==='info'?'EK BİLGİ BEKLENİYOR':'MUAYENE / DEĞERLENDİRME'}</div><h3>${esc(p.doctor)}</h3><p>${esc(p.note)}</p><strong>Kontrol tarihi: ${date(p.date)}</strong></div>${p.decision==='plan'?`<div class="plan-goals">${p.goals.map((g,i)=>`<article class="goal-card"><div class="eyebrow">HEDEF ${i+1} · ${esc(area(g.area))}</div><h3>${esc(g.title)}</h3><div class="goal-number">${g.target}<span>gün / hafta</span></div></article>`).join('')}</div>`:''}`}</div>${p?.decision==='plan'?progress():''}<div class="actions">${btn('reopen',p?.decision==='info'?'Bilgilerimi tamamla':'Başvurumu düzenle','secondary')}${btn('home','Ana sayfa','secondary')}</div><details><summary>İşlem geçmişi</summary>${history()}</details>`;}
function progress(){return `<section class="card"><h2>Bu hafta nasıl geçti?</h2><form id="entryForm">${field('entryDate','Kayıt tarihi','date',M.today(),'required max="'+M.today()+'"')}${state.plan.goals.map((g,i)=>field('days'+i,g.title+' · Gerçekleşen gün','number','','required min="0" max="7" step="1"')).join('')}${select('entrySymptoms','Yeni şikâyetiniz var mı?',[['no','Hayır'],['yes','Evet']],'','required')}${ta('entryNote','Eklemek istedikleriniz')}<button class="btn" type="submit">İlerlememi kaydet →</button></form></section><section class="card"><h2>İlerleme kayıtlarım</h2>${!state.entries.length?'<p class="muted">Henüz kayıt yok.</p>':state.entries.slice().reverse().map(e=>`<article class="entry-record"><h3>${date(e.date)}</h3>${state.plan.goals.map((g,i)=>`<div class="progress-row"><span>${esc(g.title)}</span><strong>${e.days[i]} / ${g.target} gün</strong><progress max="7" value="${e.days[i]}"></progress></div>`).join('')}${e.note?`<p class="prewrap">${esc(e.note)}</p>`:''}</article>`).join('')}</section>`;}
function capturePatient(){const f=$('#patientForm');if(!f)return;const fd=new FormData(f);for(const[k,v]of fd)if(k!=='priorities')draft[k]=v;if(step===3)draft.priorities=fd.getAll('priorities');}
function capturePlan(){const f=$('#planForm');if(!f)return planDraft;const fd=new FormData(f);planDraft={doctor:fd.get('doctor'),decision:fd.get('decision'),note:fd.get('note'),date:fd.get('date'),tests:fd.get('tests'),reviewed:fd.has('reviewed'),goals:[0,1,2].map(i=>({area:fd.get('area'+i),title:fd.get('title'+i),target:fd.get('target'+i)})).filter(g=>g.area||g.title||g.target)};return planDraft;}
function about(){const d=$('#dialog');d.innerHTML=`<h2>Sağlıklı yaş alma.</h2><p>Hareketi, günlük işlevleri ve kişinin önceliklerini birlikte ele alan bir başvuru ve takip modülü.</p><p class="mini">Veriler yalnızca açık sekmededir. Hedefler hekim tarafından oluşturulur.</p>${btn('close','Kapat')}`;d.showModal();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();const a=el.dataset.action;try{
 if(view==='patient')capturePatient();if(view==='doctor')capturePlan();
 if(a==='home')view='home';else if(a==='patient'){view=state.submitted?'tracking':'patient';}else if(a==='doctor')view='doctor';else if(a==='tracking')view=state.submitted?'tracking':'patient';
 else if(a==='start'||a==='restart'){state=M.fresh();draft=M.example();planDraft=null;guide=true;step=1;view='patient';}
 else if(a==='example'){draft=M.example();step=1;view='patient';}
 else if(a==='exampleSubmit'){M.submit(state,M.example());draft=M.example();view='doctor';}
 else if(a==='examplePlan'){if(state.profile.symptoms==='yes')throw Error('Yeni şikâyet başvurusunda ek bilgi veya muayene adımını seçin.');planDraft=M.examplePlan();}
 else if(a==='back')step=Math.max(1,step-1);else if(a==='edit'){view='patient';step=1;}
 else if(a==='send'){M.submit(state,draft);planDraft=null;view='tracking';toast('Başvurunuz iletildi.');}
 else if(a==='reopen'){if(state.plan&&!confirm('Başvuruyu düzenlemek mevcut planı sıfırlar. Devam edilsin mi?'))return;draft=JSON.parse(JSON.stringify(state.profile));M.reopen(state);planDraft=null;view='patient';step=1;}
 else if(a==='about'){about();return;}else if(a==='close'){$('#dialog').close();return;}
 render();}catch(err){toast(err.message);}});
document.addEventListener('change',e=>{if(e.target.id==='decision'){$('#goalsSection').hidden=e.target.value!=='plan';}if(e.target.name==='priorities'){if($$('input[name="priorities"]:checked').length>3){e.target.checked=false;toast('En fazla üç öncelik seçebilirsiniz.');}}});
function $$(s){return [...document.querySelectorAll(s)];}
document.addEventListener('submit',e=>{e.preventDefault();try{if(e.target.id==='patientForm'){capturePatient();if(step===1){if(!draft.age||!draft.symptoms)throw Error('Yaş ve şikâyet durumunu tamamlayın.');if(draft.symptoms==='yes'&&!draft.symptomNote?.trim())throw Error('Şikâyetinizi kısaca belirtin.');}if(step<3)step++;else{const err=M.profileError(draft);if(err)throw Error(err);view='review';}}
 else if(e.target.id==='planForm'){const p=capturePlan();if(state.plan&&!confirm('Güncellenen plan önceki ilerleme kayıtlarını sıfırlar. Devam edilsin mi?'))return;M.savePlan(state,p);planDraft=null;view='tracking';toast('Hekim planı iletildi.');}
 else if(e.target.id==='entryForm'){const fd=new FormData(e.target);M.addEntry(state,{date:fd.get('entryDate'),days:state.plan.goals.map((_,i)=>fd.get('days'+i)),symptoms:fd.get('entrySymptoms'),note:fd.get('entryNote')});toast('İlerleme kaydınız eklendi.');}render();}catch(err){toast(err.message);}});
render();})();
</script></body></html>
