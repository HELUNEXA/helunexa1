<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HELUNEXA - Başvuru Formu</title>
    <link rel="icon" href="favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, Arial, sans-serif; background: #f4f6f9; padding: 20px; margin: 0; }
        .form-container { max-width: 600px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: 0 auto; }
        .logo-header { text-align: center; margin-bottom: 15px; }
        .logo-header img { height: 100px; width: auto; }
        .subtitle { color: #64748b; text-align: center; font-size: 14px; margin-bottom: 25px; }
        .user-banner { background: #ecfdf5; border-left: 4px solid #10b981; padding: 12px 15px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; color: #065f46; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #334155; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; font-family: inherit; -webkit-appearance: none; appearance: none; background: white; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }
        .submit-btn { background-color: #10b981; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .submit-btn:hover { background-color: #059669; }
        .dynamic-box { display: none; background: #f8fafc; padding: 15px; border-radius: 8px; border-left: 4px solid #3b82f6; margin-bottom: 15px; }
        .dynamic-box h4 { color: #1e40af; font-size: 14px; margin-bottom: 12px; }
        .payment-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .payment-overlay.active { display: flex; }
        .payment-modal { background: white; border-radius: 12px; max-width: 450px; width: 100%; padding: 30px; }
        .payment-modal h3 { margin-bottom: 20px; font-size: 20px; }
        .payment-summary { background: #f8fafc; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #3b82f6; }
        .payment-summary div { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .payment-total { display: flex; justify-content: space-between; align-items: center; background: #ecfdf5; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #10b981; }
        .payment-total strong { font-size: 22px; color: #059669; }
        .payment-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .payment-buttons button { flex: 1; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; }
        .btn-cancel { background: #e2e8f0; color: #475569; }
        .btn-pay { background: #3b82f6; color: white; }
    </style>
</head>
<body class="notranslate">
    <div class="form-container">
        <div class="logo-header"><img src="logo.png" alt="HELUNEXA"></div>
        <p class="subtitle">Hasta Başvuru Formu</p>
        <div class="user-banner">👤 <strong id="userEmail">Yükleniyor...</strong> olarak giriş yapıldı</div>

        <form id="healthForm" novalidate>
            <div class="form-group"><label>Ad Soyad *</label><input type="text" id="fullname" required></div>
            <div class="form-group"><label>Yaş *</label><input type="number" id="age" required></div>
            <div class="form-group"><label>Telefon *</label><input type="tel" id="phone" required></div>

            <div class="form-group">
                <label>Hizmet Seçimi *</label>
                <select id="service_type" required>
                    <option value="">Seçiniz</option>
                    <option value="Rutin Kontrol" data-price="500">1. Rutin Kontrol / Check-up</option>
                    <option value="Kronik Hastalık Takibi" data-price="1500">2. Kronik Hastalık Takibi</option>
                    <option value="İlaç Raporu Yenileme" data-price="500">3. İlaç Raporu Yenileme</option>
                </select>
            </div>

            <div id="box_chronic" class="dynamic-box"><h4>🩺 Kronik Hastalık Takibi</h4><p style="font-size:12px; color:#64748b;">Kronik takip için özel sayfamıza yönlendirileceksiniz.</p></div>

            <div id="appointmentBox" style="display:none; background:#ecfdf5; padding:15px; border-radius:8px; border-left:4px solid #10b981; margin-bottom:15px;">
                <h4 style="color:#065f46; font-size:14px; margin-bottom:12px;">📅 Online Görüşme Randevusu</h4>
                <div class="form-group"><label>Randevu Tarihi *</label><input type="date" id="appointmentDate"></div>
                <div class="form-group"><label>Randevu Saati *</label><input type="time" id="appointmentTime"></div>
            </div>

            <input type="checkbox" id="kvkk_consent" style="display:none;">
            <div style="background:#f8fafc; padding:15px; border-radius:8px; margin-bottom:15px; border-left:4px solid #10b981;">
                <button type="button" id="kvkkBtn" style="padding:10px 20px; background:#f0fdf4; border:2px solid #10b981; border-radius:8px; color:#065f46; font-weight:bold; cursor:pointer;">⬜ KVKK Onayı Ver</button>
                <div style="font-size:13px; color:#475569; margin-top:10px;"><strong>Sağlık verilerimin işlenmesine açık rıza veriyorum.</strong> *</div>
            </div>

            <button type="submit" class="submit-btn">💳 Ödemeye Geç</button>
        </form>
    </div>

    <!-- ÖDEME MODALI -->
    <div class="payment-overlay" id="paymentGatewayModal">
        <div class="payment-modal">
            <h3>💳 Güvenli Ödeme</h3>
            <div class="payment-summary"><div><span>Hasta:</span><strong id="payPatient">-</strong></div><div><span>Hizmet:</span><strong id="payService">-</strong></div></div>
            <div class="payment-total"><span>Ödenecek Tutar</span><strong id="payAmount">₺0</strong></div>
            <div class="payment-buttons"><button type="button" class="btn-cancel" id="cancelPaymentBtn">İptal</button><button type="button" class="btn-pay" id="payBtn">Ödemeyi Tamamla</button></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://grbjmhknmlheoyknmyhd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lA5YB8KySIyhrLseQV56Kw_cWLCWq7p';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, storageKey: 'helunexa-hasta-auth' } });

        let currentUser = null;

        async function checkSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) { 
                currentUser = session.user; 
                document.getElementById('userEmail').textContent = session.user.email; 
            } else { 
                window.location.href = 'giris.html'; 
            }
        }

        document.getElementById('kvkkBtn').addEventListener('click', function() {
            const cb = document.getElementById('kvkk_consent');
            cb.checked = !cb.checked;
            this.innerHTML = cb.checked ? '✅ KVKK Onayı Verildi' : '⬜ KVKK Onayı Ver';
            this.style.background = cb.checked ? '#10b981' : '#f0fdf4';
            this.style.color = cb.checked ? 'white' : '#065f46';
        });

        document.getElementById('service_type').addEventListener('change', function() {
            const val = this.value;
            document.querySelectorAll('.dynamic-box').forEach(box => box.style.display = 'none');
            document.getElementById('appointmentBox').style.display = 'none';

            if (val === 'Kronik Hastalık Takibi') document.getElementById('box_chronic').style.display = 'block';

            // Randevu kutusu, Kronik Takip seçildiğinde GİZLENİR
            if (val && val !== 'Kronik Hastalık Takibi') {
                document.getElementById('appointmentBox').style.display = 'block';
            }
        });

        document.getElementById('healthForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!currentUser) return alert('Oturum bulunamadı.');
            if (!document.getElementById('kvkk_consent').checked) return alert('Lütfen KVKK onayını verin.');

            const service = document.getElementById('service_type').value;
            if (!service) return alert('Lütfen hizmet seçin.');

            // KRONİK TAKİP YÖNLENDİRMESİ
            if (service === 'Kronik Hastalık Takibi') {
                sessionStorage.setItem('kronik_hasta_bilgi', JSON.stringify({
                    fullname: document.getElementById('fullname').value.trim(),
                    age: document.getElementById('age').value,
                    phone: document.getElementById('phone').value.trim()
                }));
                window.location.href = 'kronik-takip.html';
                return;
            }

            // Check-up için ödeme ekranı simülasyonu
            document.getElementById('payPatient').textContent = document.getElementById('fullname').value;
            document.getElementById('payService').textContent = service;
            document.getElementById('payAmount').textContent = '₺' + (service === 'Rutin Kontrol' ? '500' : '500');
            document.getElementById('paymentGatewayModal').classList.add('active');
        });

        document.getElementById('cancelPaymentBtn').onclick = () => document.getElementById('paymentGatewayModal').classList.remove('active');
        document.getElementById('payBtn').onclick = async () => {
            const service = document.getElementById('service_type').value;
            const { error } = await _supabase.from('applications').insert([{
                user_id: currentUser.id, email: currentUser.email,
                fullname: document.getElementById('fullname').value.trim(),
                age: parseInt(document.getElementById('age').value),
                phone: document.getElementById('phone').value.trim(),
                service_type: service, status: 'pending', payment_amount: 500
            }]);
            if (error) alert('Hata: ' + error.message);
            else { alert('✅ Başvuru Alındı!'); window.location.href = 'hasta-panel.html'; }
        };

        checkSession();
    </script>
</body>
</html>
