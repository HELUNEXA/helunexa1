</style></head><body><noscript><p>Bu modülü JavaScript etkin Safari veya Chrome'da web bağlantısından açın.</p></noscript><a class="skip" href="#main">İçeriğe geç</a><header id="header"></header><main id="main" tabindex="-1"></main><footer><span>HELUNEXA · Modül 07 · Anne ve Bebek Sağlığı</span><span>Bilgiler bu sekmede tutulur</span><button class="text" data-action="about">Modül hakkında ↗</button></footer><dialog id="dialog"></dialog><div id="toast" role="status" hidden></div><script>(function(root){'use strict';const STAGES={pregnancy:'Gebelik yolculuğu',postpartum:'Doğum sonrası anne takibi',baby:'Bebek takibi'};const trim=v=>String(v??'').trim();
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function validDate(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v||''))return false;const d=new Date(v+'T12:00:00Z');return Number.isFinite(+d)&&d.toISOString().slice(0,10)===v;}
function future(n){const d=new Date(today()+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function yearsAgo(n){const d=new Date(today()+'T12:00:00Z'),m=d.getUTCMonth();d.setUTCFullYear(d.getUTCFullYear()-n);if(d.getUTCMonth()!==m)d.setUTCDate(0);return d.toISOString().slice(0,10);}
function fresh(){return {profile:null,submitted:false,version:0,plan:null,ack:false,entries:[],followup:null,history:[]};}
function log(s,text){s.history.push({at:new Date().toISOString(),text});}
function profileError(p){if(!STAGES[p.stage])return 'Takip alanını seçin.';if(p.alert==='yes')return 'Tehlike belirtisinde uygulama yanıtını beklemeyin; sağlık kuruluşuna başvurun. Acil yardım gerekiyorsa 112’yi arayın.';if(!['no','unknown'].includes(p.alert))return 'Tehlike belirtisi durumunu belirtin.';if(p.stage==='baby'){
 if(!validDate(p.birthDate)||p.birthDate>today()||p.birthDate<yearsAgo(2))return 'Bebek doğum tarihi son 24 ay içinde ve bugün ya da öncesinde olmalı.';
 if(!trim(p.guardian)||!trim(p.relationship)||!p.authorized)return 'Yasal temsilci / yetkili kişinin adı, ilişkisi ve paylaşım beyanı gerekli.';
 }else{
 if(!Number.isInteger(Number(p.age))||Number(p.age)<18||Number(p.age)>65)return 'Anne yaşını 18–65 arasında girin.';
 if(p.stage==='postpartum'&&(!validDate(p.deliveryDate)||p.deliveryDate>today()||p.deliveryDate<yearsAgo(1)))return 'Doğum sonrası anne takibi için son bir yıl içinde geçerli bir doğum tarihi girin.';
 if(p.stage==='pregnancy'){
 if(trim(p.week)&&(!Number.isInteger(Number(p.week))||Number(p.week)<0||Number(p.week)>42))return 'Gebelik haftasını 0–42 arasında girin.';
 if(trim(p.days)&&(!trim(p.week)||!Number.isInteger(Number(p.days))||Number(p.days)<0||Number(p.days)>6))return 'Hafta alanını ve 0–6 gün bilgisini kontrol edin.';
 }}if(!trim(p.request))return 'Beklentinizi veya takip ihtiyacını kısaca belirtin.';return '';}
function submit(s,p){if(s.profile&&s.profile.stage!==p.stage)throw Error("Farklı bir takip alanı için yeni başvuru başlatın.");const err=profileError(p);if(err)throw Error(err);s.profile=JSON.parse(JSON.stringify(p));s.submitted=true;s.plan=null;s.ack=false;s.followup=null;log(s,'Başvuru iletildi · '+STAGES[p.stage]);}
function planError(s,p){if(!s.submitted)return 'Önce başvuru gönderilmeli.';if(!trim(p.doctor)||!p.reviewed)return 'Hekim adı ve inceleme onayı gerekli.';if(!['plan','info','exam'].includes(p.decision))return 'Sonraki adımı seçin.';if(!trim(p.note))return 'Kullanıcıya iletilecek planı yazın.';if(p.decision==='plan'){
 if(s.profile.alert!=='no')return 'Belirsiz tehlike belirtisinde ek bilgi veya yüz yüze değerlendirme adımını seçin.';
 if(!p.items||p.items.length<1||p.items.length>3)return 'Bir ile üç kontrol adımı oluşturun.';
 for(const x of p.items)if(!trim(x.title)||!trim(x.responsible)||!validDate(x.date)||x.date<today())return 'Her adım için açıklama, sorumlu ve geçerli tarih gerekli.';
 }else if(!validDate(p.date)||p.date<today()||!trim(p.responsible))return 'Sonraki adımın tarihini ve sorumlu birimini belirtin.';return '';}
function savePlan(s,p){const err=planError(s,p);if(err)throw Error(err);s.version++;s.plan={...JSON.parse(JSON.stringify(p)),version:s.version};s.plan.items=p.decision==='plan'?s.plan.items.map((x,i)=>({...x,id:'step'+i})):[];s.ack=false;s.followup=null;log(s,'Hekim planı iletildi · Plan '+s.version);}
function acknowledge(s){if(s.plan?.decision!=='plan')throw Error('Önce kontrol planı oluşturulmalı.');s.ack=true;log(s,'Kullanıcı kontrol planını gördüğünü belirtti.');}
function entryError(s,e){if(s.plan?.decision!=='plan'||!s.ack)return 'Kontrol planı ve planı gördüğünüz kaydı gerekli.';if(!s.plan.items.some(x=>x.id===e.item))return 'Planlanan kontrol adımını seçin.';if(!validDate(e.date)||e.date>today())return 'Bugün veya öncesinde geçerli bir bilgi / sonuç tarihi girin.';if(!['done','notdone'].includes(e.status)||!trim(e.note))return 'Kontrol durumunu ve paylaşım notunu tamamlayın.';if(!['no','yes','unknown'].includes(e.concern))return 'Yeni belirti / sorun durumunu belirtin.';return '';}
function addEntry(s,e){const err=entryError(s,e);if(err)throw Error(err);const item=s.plan.items.find(x=>x.id===e.item);s.entries.push({...JSON.parse(JSON.stringify(e)),version:s.version,title:item.title,subject:s.profile.stage});s.followup=null;log(s,'Kontrol / sonuç bilgisi paylaşıldı · '+item.title);}
function latestEntries(s){if(!s.plan)return [];return s.plan.items.map(x=>s.entries.filter(e=>e.version===s.version&&e.item===x.id).at(-1)).filter(Boolean);}
function followupError(s,f){const entries=latestEntries(s);if(s.plan?.decision!=='plan'||!entries.length)return 'Önce güncel kontrol / sonuç bilgisi paylaşılmalı.';if(!trim(f.doctor)||!f.reviewed)return 'Hekim adı ve inceleme onayı gerekli.';if(!['continue','info','exam'].includes(f.action))return 'Sonraki adımı seçin.';if(f.action==='continue'&&(entries.length!==s.plan.items.length||entries.some(e=>e.status!=='done'||e.concern!=='no')))return 'Eksik kontrol, yeni veya belirsiz sorun için ek bilgi / değerlendirme adımını seçin.';if(!trim(f.note)||!trim(f.responsible)||!validDate(f.date)||f.date<today())return 'Takip açıklamasını, sorumlu birimi ve geçerli tarihi tamamlayın.';return '';}
function saveFollowup(s,f){const err=followupError(s,f);if(err)throw Error(err);s.followup={...JSON.parse(JSON.stringify(f)),version:s.version};log(s,'Hekim değerlendirmesi ve sonraki kontrol planı iletildi.');}
function reopen(s){s.submitted=false;s.plan=null;s.ack=false;s.followup=null;log(s,'Başvuru düzenlemeye açıldı; eski paylaşımlar geçmişte korundu.');}
function example(stage='pregnancy'){const base={stage,name:'Deniz Örnek',age:'30',week:'24',days:'2',alert:'no',request:'Kontrol planımı ve sonuç sonrası adımları aynı ekrandan takip etmek istiyorum.',history:'Bilinen kronik hastalık ve önemli operasyon bildirilmedi.',medicines:'Kullanılan ilaç ve takviye listesi görüşmede paylaşılacak.',previous:'Son kontrol ve mevcut rapor bilgileri hekimle paylaşılacak.',support:'Yakınlarımdan destek alıyorum.',deliveryDate:future(-21),deliveryMode:'Belirtmek istemiyorum',birthDate:future(-45),guardian:'Ekin Örnek',relationship:'Ebeveyni',authorized:true,birthHistory:'Doğum ve taburculuk bilgileri pediatri değerlendirmesinde paylaşılacak.',feeding:'Beslenme ve bez takibi bilgilerini paylaşmak istiyorum.',vaccines:'Aşı ve tarama kayıtları hekimle gözden geçirilecek.',measurements:'Kilo, boy ve ölçüm tarihleri kontrol notunda paylaşılacak.'};if(stage==='baby')base.name='Bebek Örnek';if(stage==='postpartum')base.request='Doğum sonrası kontrol, emzirme ve iyilik hâli için takip planımı netleştirmek istiyorum.';return base;}
function examplePlan(stage){const names=stage==='pregnancy'?['Gebelik kontrolü ve mevcut sonuçların değerlendirilmesi','Sonraki kontrol için soruların görüşülmesi']:stage==='postpartum'?['Doğum sonrası anne kontrolü','Emzirme ve destek gereksiniminin görüşülmesi']:['Bebek kontrolü ve mevcut büyüme kayıtlarının değerlendirilmesi','Aşı ve tarama geçmişinin gözden geçirilmesi'];const responsible=stage==='baby'?'Örnek Çocuk Sağlığı Birimi':'Örnek Kadın Sağlığı Birimi';return {doctor:'Dr. Örnek Hekim',reviewed:false,decision:'plan',note:'Mevcut bilgiler ve beklentiler görüşülerek aşağıdaki kontrol adımları belirlendi.',items:names.map(title=>({title,date:future(7),responsible})),date:future(7),responsible};}

})(typeof window!=='undefined'?window:globalThis);

 $('#main').innerHTML=(guide?`<aside class="guide"><div class="row"><b>ANNE VE BEBEK SAĞLIĞI · SÜREÇ</b><button class="text" data-action="start">Yeniden başlat ↻</button></div><p>${!state.submitted?'Hazır başvuruyu inceleyip gönderin.':!state.plan?'Hekim ekranında kontrol planını oluşturun.':!state.ack?'Hasta ekranında kontrol planını inceleyin.':!M.latestEntries(state).length?'Örnek kontrol bilgilerini paylaşın.':!state.followup?'Hekim ekranında paylaşımları inceleyip takip planını iletin.':'Sonraki kontrol ve sorumlu birim hasta ekranında görünüyor.'}</p></aside>`:'')+(view==='home'?home():view==='patient'?patient():view==='review'?review():view==='doctor'?doctor():tracking());$('#main').focus({preventScroll:true});window.scrollTo(0,0);
}
function home(){return `<section class="hero"><div class="eyebrow">MODÜL 07 · ANNE VE BEBEK SAĞLIĞI / GEBELİK YOLCULUĞU</div><h1>Yeni bir yolculuk,<br>birlikte takipte.</h1><p class="muted">Gebelikten doğum sonrasına, bebeğinizin kontrollerine kadar; hekiminizin planını ve sonraki adımları takip edin.</p><div class="entry-grid"><button class="entry" data-action="patient"><span class="icon">↗</span><strong>Hasta / Ebeveyn Girişi</strong><span>Başvuru ve kontrol takibi</span></button><button class="entry" data-action="doctor"><span class="icon">✳</span><strong>Hekim Girişi</strong><span>Değerlendirme ve kontrol planı</span></button></div><div class="actions">${btn('start','Süreci başlat →','soft')}</div></section><section class="catalog three" aria-label="Takip alanları">${Object.entries(M.STAGES).map(([k,t],i)=>`<article class="area"><div class="eyebrow">0${i+1} / TAKİP ALANI</div><h3>${t}</h3><p>${k==='pregnancy'?'Gebelik bilgileri, mevcut sonuçlar ve hekimin belirlediği kontroller.':k==='postpartum'?'Annenin doğum sonrası kontrolü, emzirme ve destek gereksinimleri.':'Bebeğin kontrol, büyüme, beslenme, aşı ve tarama kayıtlarının gözden geçirilmesi.'}</p><button class="text" data-action="begin-${k}">Başvuruya geç →</button></article>`).join('')}</section>`;}
function patient(){if(state.submitted)return tracking();const p=draft,stage=p.stage||'pregnancy',baby=stage==='baby';return head('KISA BAŞVURU','Yolculuğunuzun hangi aşamasındasınız?','İlgili bilgileri paylaşmanız yeterli.',btn('example','Örnek doldur','secondary'))+`<form id="patientForm" class="card">${sel('stage','Takip alanı',Object.entries(M.STAGES),stage,state.profile?'disabled':'required')}<div class="form-grid">${field('name',baby?'Bebek / başvuru adı · İsteğe bağlı':'Anne / başvuru adı · İsteğe bağlı','text',p.name)}${baby?field('birthDate','Bebeğin doğum tarihi','date',p.birthDate,'required min="'+M.yearsAgo(2)+'" max="'+M.today()+'"'):field('age','Anne yaşı','number',p.age,'required min="18" max="65" step="1"')}</div><div style="height:20px"></div>${stage==='pregnancy'?`<div class="form-grid">${field('week','Gebelik haftası · Biliyorsanız','number',p.week,'min="0" max="42" step="1"')}${field('days','Ek gün · 0–6','number',p.days,'min="0" max="6" step="1"')}</div><div style="height:20px"></div>`:stage==='postpartum'?`${field('deliveryDate','Doğum tarihi','date',p.deliveryDate,'required min="'+M.yearsAgo(1)+'" max="'+M.today()+'"')}${sel('deliveryMode','Doğum şekli · İsteğe bağlı',[['Vajinal doğum','Vajinal doğum'],['Sezaryen','Sezaryen'],['Belirtmek istemiyorum','Belirtmek istemiyorum']],p.deliveryMode)}`:`${field('guardian','Başvuran yasal temsilci / yetkili kişi','text',p.guardian,'required')}${field('relationship','Bebekle ilişkiniz','text',p.relationship,'required')}<label class="check"><input type="checkbox" name="authorized" ${p.authorized?'checked':''} required><span>Bebeğin bilgilerini bu başvuru için paylaşmaya yetkili olduğumu beyan ediyorum.</span></label>`}${sel('alert','Aşağıda örneklenen tehlike belirtilerinden biri şu anda var mı?',yn,p.alert,'required')}<p class="mini">${warning(stage)}</p><div id="alertNotice" class="notice urgent" ${p.alert&&p.alert!=='no'?'':'hidden'}>${warning(stage)}</div>${baby?`${ta('birthHistory','Doğum, erken doğum ve taburculuk bilgileri · Varsa',p.birthHistory)}${ta('feeding','Beslenme, emzirme ve günlük bakım hakkında eklemek istedikleriniz',p.feeding)}${ta('vaccines','Yapılmış aşılar ve yenidoğan / bebek taramaları · Bildiğiniz kadarıyla',p.vaccines)}${ta('measurements','Mevcut ölçümler · Kilo (g), boy (cm), ölçüm tarihi · Varsa',p.measurements)}`:`${ta('history','Önceki gebelikler, doğumlar, kayıplar, hastalık ve operasyon öyküsü · Varsa',p.history)}${ta('support',stage==='postpartum'?'Emzirme, iyilik hâli ve destek ihtiyacınız · Eklemek isterseniz':'Günlük yaşam ve destek ihtiyacınız · Eklemek isterseniz',p.support)}`}${ta('medicines',baby?'Bebeğin ilaçları, takviyeleri ve alerjileri · Varsa':'İlaçlar, vitaminler, takviyeler ve alerjiler · Varsa',p.medicines)}${ta('previous','Önceki kontrol, tahlil ve rapor bilgileri · Tarihleriyle birlikte varsa',p.previous)}${ta('request','Beklentiniz / takip ihtiyacınız',p.request,'required')}<div class="actions">${btn('home','Geri','secondary')}<button class="btn" type="submit" id="reviewButton" ${p.alert==='yes'?'disabled':''}>Başvurumu incele →</button></div></form>`;}
function subject(p){return M.STAGES[p.stage]+' · '+(p.name||'İsimsiz başvuru');}
function summary(p){const baby=p.stage==='baby';return `<div class="subject">${esc(subject(p))}</div><dl class="summary"><div><dt>${baby?'Doğum tarihi':'Anne yaşı'}</dt><dd>${baby?date(p.birthDate):esc(p.age)+' yaş'}</dd></div><div><dt>${p.stage==='pregnancy'?'Bildirilen gebelik haftası':baby?'Başvuran':'Doğum tarihi'}</dt><dd>${p.stage==='pregnancy'?(p.week!==''&&p.week!=null?esc(p.week)+' hafta '+esc(p.days||0)+' gün':'Belirtilmedi'):baby?esc(p.guardian)+' · '+esc(p.relationship):date(p.deliveryDate)}</dd></div><div class="wide"><dt>Beklenti / takip ihtiyacı</dt><dd>${esc(p.request)}</dd></div></dl><details><summary>Paylaşılan sağlık ve kontrol bilgileri</summary><dl class="summary">${[['Tehlike belirtisi',p.alert==='no'?'Bildirilmedi':'Belirsiz'],...(baby?[['Doğum / taburculuk',p.birthHistory],['Beslenme',p.feeding],['Aşı ve taramalar',p.vaccines],['Mevcut ölçümler',p.measurements]]:[['Öykü',p.history],['Destek ihtiyacı',p.support],...(p.stage==='postpartum'?[['Doğum şekli',p.deliveryMode]]:[])]),['İlaçlar / takviyeler / alerjiler',p.medicines],['Önceki kontrol / sonuçlar',p.previous]].map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v||'Belirtilmedi')}</dd></div>`).join('')}</dl></details>`;}
function review(){return head('KONTROL VE GÖNDERİM','Başvurunuzu kontrol edin.','Bu başvuru yalnızca seçtiğiniz takip alanına aittir.')+`<section class="card">${summary(draft)}<div class="actions">${btn('edit','Düzenle','secondary')}${btn('send','Başvuruyu gönder →')}</div></section>`;}
function doctor(){if(!state.submitted)return head('HEKİM PANELİ','Başvurularınız.','Henüz iletilmiş başvuru yok.')+`<section class="card empty"><h2>İlk başvuruyu bekliyoruz.</h2>${btn('exampleSubmit','Örnek başvuru yükle','soft')}</section>`;return head('HEKİM PANELİ','Kontrolleri birlikte planlayın.','Başvuru bilgileri, paylaşımlar ve sonraki adım aynı dosyada.',btn('tracking','Hasta ekranını gör','secondary'))+`<section class="card">${summary(state.profile)}</section><nav class="row" style="margin-bottom:24px" aria-label="Hekim dosyası adımları">${btn('panePlan','1 · Başvuru ve plan',pane==='plan'?'':'secondary')}${btn('paneFollow','2 · Paylaşımlar ve takip',pane==='follow'?'':'secondary')}</nav>`+(pane==='plan'?planForm():followForm())+`<details><summary>İşlem geçmişi</summary>${history()}</details>`;}
function planItem(x={},i){return `<section class="plan-item"><h3>Kontrol adımı ${i+1}${i?' · İsteğe bağlı':''}</h3>${field('title'+i,'Kontrol / inceleme açıklaması','text',x.title)}<div class="form-grid">${field('date'+i,'Planlanan tarih','date',x.date,'min="'+M.today()+'"')}${field('responsible'+i,'Sorumlu hekim / birim','text',x.responsible)}</div></section>`;}
function planForm(){const p=pdraft||state.plan||{};return `<form id="planForm" class="card"><div class="row" style="justify-content:space-between"><h2>Hekim kontrol planı</h2>${btn('examplePlan','Örnek planı doldur','secondary')}</div>${field('doctor','Değerlendiren hekim','text',p.doctor,'required')}${sel('decision','Sonraki adım',[['plan','Kontrol planı oluştur'],['info','Ek bilgi / mevcut rapor iste'],['exam','Yüz yüze değerlendirme']],p.decision,'required')}${ta('planNote','Kullanıcıya iletilecek plan / sonraki adım',p.note,'required')}<section id="itemsSection" ${p.decision==='plan'?'':'hidden'}><p class="mini">Bir ile üç kontrol adımı belirleyebilirsiniz. Tarihler ve kapsam hekim tarafından seçilir.</p>${[0,1,2].map(i=>planItem(p.items?.[i],i)).join('')}</section><section id="otherSection" ${p.decision==='plan'?'hidden':''}>${field('otherDate','Yeniden değerlendirme tarihi','date',p.date,'min="'+M.today()+'"')}${field('otherResponsible','Sorumlu hekim / birim','text',p.responsible)}</section><label class="check"><input name="reviewed" type="checkbox" ${p.reviewed?'checked':''} required><span>Paylaşılan sağlık bilgilerini ve önceki kontrolleri inceledim; uygun sonraki adımı belirledim.</span></label>${state.plan?'<p class="mini">Yeni plan kaydedilirse önceki paylaşımlar geçmişte korunur; yeni plan için tekrar gözden geçirme gerekir.</p>':''}<button class="btn" type="submit">Planı kaydet ve kullanıcıya ilet →</button></form>`;}
function entries(){return state.entries.length?`<section class="card"><h2>Kontrol / sonuç paylaşımları</h2>${state.entries.slice().reverse().map(e=>`<article class="visit"><span class="badge">Plan ${e.version}${e.version!==state.version?' · Geçmiş plan':''} · ${M.STAGES[e.subject]}</span><h3 style="margin-top:12px">${esc(e.title)}</h3><p class="mini">${date(e.date)} · ${e.status==='done'?'Kontrol yapıldığı bildirildi':'Kontrol henüz yapılmadı'}</p><p class="pre">${esc(e.note)}</p><p class="mini">Yeni belirti / sorun: ${e.concern==='no'?'Bildirilmedi':e.concern==='yes'?'Bildirildi':'Belirsiz'}</p></article>`).join('')}</section>`:'';}
function followForm(){const p=state.plan,f=fdraft||state.followup||{};if(!M.latestEntries(state).length)return `<section class="card"><h2>Güncel plan için paylaşım bekleniyor.</h2><p>Kullanıcının kontrol veya sonuç bilgisi burada görünecek.</p></section>${entries()}`;return `${entries()}<form id="followForm" class="card"><div class="row" style="justify-content:space-between"><h2>Değerlendirme ve sonraki kontrol</h2>${guide?btn('exampleFollow','Örnek takibi doldur','secondary'):''}</div>${field('followDoctor','Değerlendiren hekim','text',f.doctor||p.doctor,'required')}${sel('followAction','Sonraki takip adımı',[['continue','Sonraki planlı kontrol'],['info','Ek bilgi / eksik kontrol sonucu'],['exam','Yüz yüze değerlendirme']],f.action,'required')}${ta('followNote','Kullanıcıya iletilecek değerlendirme ve plan',f.note,'required')}${field('followResponsible','Takipten sorumlu hekim / birim','text',f.responsible,'required')}${field('followDate','Sonraki kontrol / değerlendirme tarihi','date',f.date,'required min="'+M.today()+'"')}<label class="check"><input type="checkbox" name="followReviewed" required><span>Paylaşılan kontrol / sonuç bilgilerini inceledim ve takip planını belirledim.</span></label><button class="btn" type="submit">Takip planını kullanıcıya ilet →</button></form>`;}
function tracking(){if(!state.submitted)return patient();const p=state.plan,f=state.followup;return head('HASTA / EBEVEYN PANELİ','Yolculuğunuzun sonraki adımı.','Kontrol planınız ve hekim değerlendirmeniz aynı yerde.',btn('doctor','Hekim ekranına geç','secondary'))+`<div class="steps"><div class="step active">1 · Başvuru</div><div class="step ${p?'active':''}">2 · Hekim planı</div><div class="step ${M.latestEntries(state).length?'active':''}">3 · Paylaşım</div><div class="step ${f?'active':''}">4 · Takip</div></div><section class="card">${summary(state.profile)}${!p?'<div class="outcome"><h3>Hekim değerlendirmesinde.</h3><p>Kontrol planınız burada görünecek.</p></div>':`<div class="outcome"><div class="eyebrow">${p.decision==='plan'?'HEKİMİNİZİN KONTROL PLANI':p.decision==='info'?'EK BİLGİ / RAPOR BEKLENİYOR':'YÜZ YÜZE DEĞERLENDİRME'}</div><h3>${esc(p.doctor)}</h3><p>${esc(p.note)}</p>${p.decision!=='plan'?`<strong>Tarih: ${date(p.date)}</strong><p>${esc(p.responsible)}</p>`:''}</div>${p.items.length?`<div class="task-grid">${p.items.map((x,i)=>`<article class="task-card"><div class="eyebrow">KONTROL ${i+1}</div><h3>${esc(x.title)}</h3><strong>${date(x.date)}</strong><p class="mini">${esc(x.responsible)}</p></article>`).join('')}</div>`:''}${p.decision==='plan'&&!state.ack?`<form id="ackForm"><label class="check"><input type="checkbox" required><span>Hekimin oluşturduğu kontrol planını gördüm.</span></label><button class="btn" type="submit">Planı gördüm, takibe geç →</button></form>`:''}`}</section>${p?.decision==='plan'&&state.ack?recordForm():''}${entries()}${f?`<section class="card"><div class="eyebrow">SONRAKİ ADIMINIZ</div><h2>${f.action==='continue'?'Sonraki kontrolünüz planlandı.':f.action==='info'?'Ek bilgi / kontrol sonucu bekleniyor.':'Yüz yüze değerlendirme planlandı.'}</h2><p class="pre">${esc(f.note)}</p><dl class="summary"><div><dt>Tarih</dt><dd>${date(f.date)}</dd></div><div><dt>Sorumlu hekim / birim</dt><dd>${esc(f.responsible)}</dd></div></dl></section>`:M.latestEntries(state).length?'<p class="notice">Son paylaşımınız için hekim değerlendirmesi bekleniyor.</p>':''}<p class="notice">${warning(state.profile.stage)}</p><div class="actions">${btn('reopen',p?.decision==='info'?'Bilgilerimi tamamla':'Başvurumu düzenle','secondary')}${btn('new','Yeni başvuru','secondary')}${btn('home','Ana sayfa','secondary')}</div><details><summary>İşlem geçmişi</summary>${history()}</details>`;}
function recordForm(){return `<section class="card"><div class="row" style="justify-content:space-between"><h2>Kontrol bilgisi paylaşın.</h2>${guide?btn('exampleEntries','Örnek kontrol bilgilerini ekle','secondary'):''}</div><p class="mini">Yapılan kontrolün notunu veya mevcut rapor bilgisini paylaşabilirsiniz. Bu kayıt, hekim değerlendirmesinin yerine geçmez.</p><form id="entryForm">${sel('item','Kontrol adımı',state.plan.items.map(x=>[x.id,x.title]),'','required')}${field('entryDate','Kontrol / bilgi tarihi','date',M.today(),'required max="'+M.today()+'"')}${sel('entryStatus','Kontrol durumu',[['done','Kontrol yapıldı / bilgi mevcut'],['notdone','Henüz yapılamadı']],'','required')}${ta('entryNote','Kontrol notu, rapor bilgisi veya yapılamama nedeni','','required')}${sel('entryConcern','Yeni belirti veya sorun var mı?',yn,'','required')}<div id="entryWarning" class="notice urgent" hidden>${warning(state.profile.stage)}</div><button class="btn" type="submit">Kontrol bilgisini hekime ilet →</button></form></section>`;}
function history(){return `<div class="timeline">${state.history.map(x=>`<p><b>${esc(x.text)}</b>${new Date(x.at).toLocaleString('tr-TR',{timeZone:'Europe/Istanbul'})}</p>`).join('')}</div>`;}
function capturePatient(){const f=$('#patientForm');if(!f)return;const d=new FormData(f);for(const[k,v]of d)draft[k]=v;if(draft.stage==='baby')draft.authorized=d.has('authorized');}
function captureForms(){if($('#planForm')){const d=new FormData($('#planForm'));pdraft={doctor:d.get('doctor'),decision:d.get('decision'),note:d.get('planNote'),date:d.get('otherDate'),responsible:d.get('otherResponsible'),reviewed:d.has('reviewed'),items:[0,1,2].map(i=>({title:d.get('title'+i),date:d.get('date'+i),responsible:d.get('responsible'+i)})).filter(x=>x.title||x.date||x.responsible)};}if($('#followForm')){const d=new FormData($('#followForm'));fdraft={doctor:d.get('followDoctor'),action:d.get('followAction'),note:d.get('followNote'),responsible:d.get('followResponsible'),date:d.get('followDate'),reviewed:d.has('followReviewed')};}}
function start(stage,example=false){state=M.fresh();draft=example?M.example(stage):{stage};pdraft=fdraft=null;guide=example;pane='plan';view='patient';}
function about(){const d=$('#dialog');d.innerHTML=`<h2>Anne ve bebek için ayrı, görünür takip.</h2><p>Gebelik, doğum sonrası anne ve bebek başvuruları ayrı dosyalar olarak ele alınır. Hekim kontrol adımlarını, tarihleri ve sorumlu birimi belirler.</p><p class="mini">Anne başvuruları 18–65 yaş, doğum sonrası dönem son bir yıl, bebek takibi 0–24 ay içindir.</p><details><summary>Bilgilendirme kaynakları</summary><p><a href="https://bingolism.saglik.gov.tr/TR-117473/anne-ve-bebek-sagligi.html" target="_blank" rel="noopener">Sağlık Bakanlığı · Anne ve Bebek Sağlığı ↗</a></p><p><a href="https://www.who.int/tools/your-life-your-health/life-phase/pregnancy--birth-and-after-childbirth/getting-the-health-services-you-need-after-childbirth" target="_blank" rel="noopener">WHO · Doğum sonrası bakım ↗</a></p><p><a href="https://www.cdc.gov/hearher/maternal-warning-signs/" target="_blank" rel="noopener">CDC · Anne için uyarı belirtileri ↗</a></p></details>${btn('close','Kapat')}`;d.showModal();}
document.addEventListener('change',e=>{if(e.target.id==='stage'){capturePatient();render();}if(e.target.id==='alert'){$('#alertNotice').hidden=e.target.value==='no'||!e.target.value;$('#reviewButton').disabled=e.target.value==='yes';}if(e.target.id==='decision'){$('#itemsSection').hidden=e.target.value!=='plan';$('#otherSection').hidden=e.target.value==='plan';}if(e.target.id==='entryConcern')$('#entryWarning').hidden=!e.target.value||e.target.value==='no';});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();const a=el.dataset.action;try{capturePatient();captureForms();if(a==='home')view='home';else if(a==='patient')view=state.submitted?'track':'patient';else if(a==='doctor'){view='doctor';pane='plan';}else if(a==='tracking')view=state.submitted?'track':'patient';else if(a==='panePlan')pane='plan';else if(a==='paneFollow')pane='follow';
 else if(a==='new'||a.startsWith('begin-')){if(state.profile&&!confirm('Yeni bir başvuru başlatılacak; mevcut kayıt sıfırlanacak. Devam edilsin mi?'))return;start(a.startsWith('begin-')?a.slice(6):'pregnancy');}
 else if(a==='start'){start(draft.stage||state.profile?.stage||'pregnancy',true);}else if(a==='example'){draft=M.example(draft.stage||'pregnancy');}
 else if(a==='edit')view='patient';else if(a==='send'){M.submit(state,draft);pdraft=fdraft=null;view='track';toast('Başvurunuz iletildi.');}
 else if(a==='exampleSubmit'){start('pregnancy',false);draft=M.example();M.submit(state,draft);view='doctor';pane='plan';}
 else if(a==='examplePlan'){pdraft=M.examplePlan(state.profile.stage);}
 else if(a==='exampleEntries'){if(!guide||!state.ack)throw Error('Örnek paylaşım plan incelendikten sonra eklenebilir.');for(const x of state.plan.items)M.addEntry(state,{item:x.id,date:M.today(),status:'done',concern:'no',note:'Kontrol bilgisi: '+x.title+'. Hekim değerlendirmesi bekleniyor.'});toast('Kontrol bilgileri eklendi; hekim incelemesi bekleniyor.');}
 else if(a==='exampleFollow'){fdraft={doctor:state.plan.doctor,action:'continue',note:'Paylaşılan kontrol bilgileri görüşüldü. Sonraki kontrol için sorular ve mevcut kayıtlar birlikte gözden geçirilecek.',date:M.future(14),responsible:state.plan.items[0].responsible,reviewed:false};}
 else if(a==='reopen'){if(state.plan&&!confirm('Başvuru düzenlenecek; mevcut plan geçersiz olacak. Eski paylaşımlar geçmişte korunacak. Devam edilsin mi?'))return;draft=JSON.parse(JSON.stringify(state.profile));M.reopen(state);pdraft=fdraft=null;view='patient';}
 else if(a==='about'){about();return;}else if(a==='close'){$('#dialog').close();return;}render();}catch(err){toast(err.message);}});
document.addEventListener('submit',e=>{e.preventDefault();try{if(e.target.id==='patientForm'){capturePatient();const err=M.profileError(draft);if(err)throw Error(err);view='review';}else if(e.target.id==='planForm'){captureForms();const err=M.planError(state,pdraft);if(err)throw Error(err);if(state.plan&&!confirm('Yeni kontrol planı kaydedilecek. Devam edilsin mi?'))return;M.savePlan(state,pdraft);pdraft=fdraft=null;view='track';toast('Hekim planı iletildi.');}else if(e.target.id==='ackForm'){M.acknowledge(state);toast('Planı gördüğünüz kaydedildi.');}else if(e.target.id==='entryForm'){const d=new FormData(e.target);M.addEntry(state,{item:d.get('item'),date:d.get('entryDate'),status:d.get('entryStatus'),note:d.get('entryNote'),concern:d.get('entryConcern')});fdraft=null;toast('Kontrol bilgisi iletildi; hekim incelemesi bekleniyor.');}else if(e.target.id==='followForm'){captureForms();M.saveFollowup(state,fdraft);fdraft=null;view='track';toast('Hekim değerlendirmesi ve takip planı iletildi.');}render();}catch(err){toast(err.message);}});
render();})();
</script></body></html>
